<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport — Reporting marketing mensuel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-soft:#F4F8FC; --surface:#FFFFFF; --ink:#14151A; --fg:#14151A;
    --muted:#6D7178; --border:#E7EDF3;
    --accent:#2D7FE0; --accent-2:#5FA8F0; --accent-soft:#EAF3FD; --accent-fg:#FFFFFF;
    --success:#129463; --success-soft:#E7F7EF; --danger:#DF4B4B; --danger-soft:#FCEAEA;
    --warn:#B9790B; --warn-soft:#FBF1DE;
    --shadow-sm:0 1px 2px rgba(20,20,35,.05), 0 1px 1px rgba(20,20,35,.03);
    --shadow-md:0 16px 36px -12px rgba(20,20,35,.12), 0 4px 10px -4px rgba(20,20,35,.06);
    --shadow-lg:0 32px 72px -20px rgba(20,20,35,.20);
    --shadow-accent:0 14px 30px -10px rgba(45,127,224,.35);
    color-scheme: light;
  }
  /* Dark mode is opt-in only (data-theme="dark"); the app always renders light by default
     regardless of OS/browser preference, since this is a reporting tool meant to read as
     bright and clear rather than follow system dark mode. */
  :root[data-theme="dark"]{
    --bg:#0A0A0D; --bg-soft:#131318; --surface:#131318; --ink:#F2F2F6; --fg:#F2F2F6;
    --muted:#9A9AA8; --border:#232329;
    --accent:#5FA8F0; --accent-2:#8CC3F7; --accent-soft:#132A3D; --accent-fg:#0A0A0D;
    --success:#34D399; --success-soft:#0F2A22; --danger:#F87171; --danger-soft:#2A1414;
    --warn:#FBBF55; --warn-soft:#2A2110;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 16px 36px -12px rgba(0,0,0,.5), 0 4px 10px -4px rgba(0,0,0,.4);
    --shadow-lg:0 32px 72px -20px rgba(0,0,0,.6);
    --shadow-accent:0 14px 34px -8px rgba(95,168,240,.4);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15.5px; -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .font-display, .headline{ font-family:'Outfit',system-ui,sans-serif; letter-spacing:-.02em; }
  .font-mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:'Inter',sans-serif; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .text-muted{ color:var(--muted); }
  .text-accent{ color:var(--accent); }
  .border-base{ border-color:var(--border); }

  .surface{ background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); transition:transform .2s ease, box-shadow .2s ease; }
  .card{ border-radius:20px; }
  .surface.card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); }

  /* Icon chips: a colored rounded square behind each feature/step SVG icon */
  .icon-chip{
    width:2.75rem; height:2.75rem; border-radius:12px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-chip svg{ width:1.4rem; height:1.4rem; }

  /* Scroll-reveal: sections start faded/offset, .reveal-visible is toggled on by an
     IntersectionObserver as each one enters the viewport. */
  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .7s ease, transform .7s ease; }
  .reveal-visible{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    .reveal{ opacity:1; transform:none; transition:none; }
    .surface.card:hover{ transform:none; }
  }

  .btn{
    display:inline-flex; align-items:center; gap:.5rem; padding:.7rem 1.4rem;
    font-family:'Inter',sans-serif; font-weight:600; font-size:.85rem;
    border-radius:999px; border:1px solid transparent; cursor:pointer; transition:all .18s ease;
    white-space:nowrap;
  }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:var(--accent-fg); box-shadow:var(--shadow-accent); }
  .btn-primary:hover{ transform:translateY(-1px); filter:brightness(1.04); }
  .btn-ghost{ background:var(--surface); color:var(--ink); border-color:var(--border); box-shadow:var(--shadow-sm); }
  .btn-ghost:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .btn-danger{ background:transparent; color:var(--danger); border-color:transparent; }
  .btn-danger:hover{ background:var(--danger-soft); }
  .btn-sm{ padding:.5rem 1rem; font-size:.78rem; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none !important; }

  .lang-btn{
    font-family:'Inter',sans-serif; font-size:.72rem; font-weight:700; padding:.3rem .55rem; border-radius:8px;
    color:var(--muted); cursor:pointer; border:1px solid transparent; transition:all .15s;
  }
  .lang-btn:hover{ background:var(--bg-soft); color:var(--ink); }
  .lang-btn.active{ background:var(--accent-soft); color:var(--accent); }

  label.field-label{ display:block; font-family:'Inter',sans-serif; font-size:.74rem; font-weight:600; color:var(--muted); margin-bottom:.45rem; }

  input[type=text], input[type=month], input[type=number], input[type=color], textarea, select{
    background:var(--bg-soft); color:var(--ink); border:1px solid transparent;
    border-radius:14px; padding:.65rem .85rem; font-size:.9rem; width:100%; font-family:'Inter',sans-serif;
    transition:border-color .15s, background .15s;
  }
  select{ cursor:pointer; }
  input:focus, select:focus, textarea:focus{ outline:none; background:var(--surface); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .field-err{ border-color:var(--danger) !important; box-shadow:0 0 0 4px var(--danger-soft) !important; }
  .err-msg{ color:var(--danger); font-size:.78rem; margin-top:.4rem; font-weight:500; }

  .badge{
    font-family:'Inter',sans-serif; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:.25rem .6rem; border:none; color:var(--accent); border-radius:999px; background:var(--accent-soft);
    white-space:nowrap;
  }
  .badge-example{ color:var(--accent); background:var(--accent-soft); }

  .nav-item{
    margin:0 .75rem; padding:.6rem .9rem; border-radius:12px; color:var(--muted);
    font-size:.9rem; font-weight:500; cursor:pointer; transition:all .15s;
  }
  .nav-item:hover{ background:var(--bg-soft); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }

  .sidebar-item{
    margin:0 .75rem; padding:.55rem .9rem; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; gap:.6rem; transition:background .15s;
  }
  .sidebar-item:hover{ background:var(--bg-soft); }
  .sidebar-item.active{ background:var(--accent-soft); }
  .sidebar-item .cname{ color:var(--fg); }
  .sidebar-item.active .cname{ color:var(--accent); font-weight:600; }

  .scrollbar-thin::-webkit-scrollbar{ width:5px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  .delta{ display:inline-flex; align-items:center; padding:.2rem .55rem; border-radius:999px; font-weight:700; font-size:.72rem; white-space:nowrap; }
  .delta-up{ color:var(--success); background:var(--success-soft); }
  .delta-down{ color:var(--danger); background:var(--danger-soft); }
  .delta-flat{ color:var(--muted); background:var(--bg-soft); }

  table{ border-collapse:collapse; width:100%; }
  tbody tr{ border-bottom:1px solid var(--border); }
  tbody tr:last-child{ border-bottom:none; }
  thead tr{ border-bottom:1px solid var(--border); }

  /* KPI tiles: min-width:0 lets the value shrink instead of overflowing its card,
     and fitKpiValues() (JS) auto-shrinks font-size further for very large numbers
     so nothing ever clips or wraps mid-digit. */
  .kpi-card{ border-radius:20px; padding:1.75rem; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); min-width:0; overflow:hidden; }
  .kpi-value{
    font-family:'Outfit',system-ui,sans-serif; font-weight:700; font-size:2.4rem; line-height:1.1;
    margin:.6rem 0 .8rem; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
    white-space:nowrap; overflow:hidden; display:block; max-width:100%;
  }
  @media (max-width: 860px){
    .kpi-value{ font-size:1.9rem; }
  }

  .hero-glow{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  }
  .hero-glow::before, .hero-glow::after{
    content:""; position:absolute; border-radius:50%; filter:blur(70px); opacity:.35;
  }
  .hero-glow::before{ width:420px; height:420px; background:var(--accent); top:-160px; left:10%; }
  .hero-glow::after{ width:340px; height:340px; background:var(--accent-2); bottom:-140px; right:12%; opacity:.25; }

  /* Hero background: a faint dot-grid texture, under the glow blobs, under the content. */
  .hero-dotgrid{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(circle, var(--border) 1.5px, transparent 1.5px);
    background-size:28px 28px;
    mask-image:radial-gradient(ellipse 60% 55% at 50% 30%, black 40%, transparent 90%);
    -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 30%, black 40%, transparent 90%);
  }

  /* Floating stat/graph chips scattered around the hero copy, for visual interest without
     external images — each carries real-looking (but illustrative) numbers and a tiny chart. */
  .float-chip{
    position:absolute; z-index:1; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; box-shadow:var(--shadow-md); padding:.85rem 1.1rem; pointer-events:none;
    animation:floaty 6s ease-in-out infinite;
  }
  .float-chip .fc-label{ font-size:.65rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .float-chip .fc-value{ font-family:'Outfit',sans-serif; font-weight:700; font-size:1.3rem; margin-top:.15rem; }
  @keyframes floaty{
    0%, 100%{ transform:translateY(0px); }
    50%{ transform:translateY(-10px); }
  }
  @media (prefers-reduced-motion: reduce){ .float-chip{ animation:none; } }
  @media (max-width: 960px){ .float-chip{ display:none; } }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,20,30,.45); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:1.5rem;
  }
  .modal-panel{
    background:var(--surface); border-radius:20px; box-shadow:var(--shadow-lg); border:1px solid var(--border);
    max-width:560px; width:100%; max-height:85vh; overflow-y:auto; padding:2rem;
  }
  .map-row{ display:grid; grid-template-columns:1fr 1.3fr; gap:1rem; align-items:center; padding:.5rem 0; }

  /* Goal progress bars (Feature 2) */
  .goal-bar-track{ height:5px; background:var(--bg-soft); border-radius:999px; overflow:hidden; }
  .goal-bar-fill{ height:100%; border-radius:999px; transition:width .2s; }
  .goal-status{ font-weight:700; }
  .goal-status-reached{ color:var(--success); background:var(--success-soft); }
  .goal-status-inprogress{ color:var(--warn); background:var(--warn-soft); }
  .goal-status-exceeded{ color:var(--danger); background:var(--danger-soft); }

  /* Client tabs (Feature 3) */
  .tab-btn{
    padding:.55rem 1rem; border-radius:12px; font-size:.85rem; font-weight:600; color:var(--muted);
    cursor:pointer; border:none; background:transparent; transition:all .15s;
  }
  .tab-btn:hover{ background:var(--bg-soft); color:var(--ink); }
  .tab-btn.active{ background:var(--accent-soft); color:var(--accent); }

  /* Paste-from-spreadsheet panel (Feature 4B) */
  .paste-panel{ margin:.75rem 0; padding:1rem; background:var(--bg-soft); border-radius:12px; }
  .paste-panel textarea{ font-family:'IBM Plex Mono',monospace; font-size:.78rem; min-height:90px; resize:vertical; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; color:#111; }
  }
  @media (max-width: 860px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100% !important; max-height:none; position:static !important; border-right:none !important; border-bottom:1px solid var(--border); }
    .map-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="app-shell flex min-h-screen">
  <aside class="sidebar no-print flex flex-col" style="width:232px; flex-shrink:0; background:var(--bg); border-right:1px solid var(--border); position:sticky; top:0; height:100vh;">
    <div class="px-5 pt-7 pb-6">
      <div class="flex items-center gap-2.5">
        <span style="width:1.6rem; height:1.6rem; border-radius:8px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink:0; box-shadow:var(--shadow-accent);"></span>
        <h1 class="headline font-bold" style="font-size:1.35rem; line-height:1;" id="appNameLabel">Rapport</h1>
      </div>
      <p class="text-muted text-xs mt-2" id="taglineLabel">Reporting marketing</p>
    </div>

    <nav class="flex flex-col gap-1">
      <div class="nav-item flex items-center gap-2.5" id="navHome" data-action="go-home"><span id="navHomeIcon" style="display:flex; flex-shrink:0;"></span><span id="navHomeLabel">Accueil</span></div>
      <div class="nav-item flex items-center gap-2.5" id="navDashboard" data-action="go-dashboard"><span id="navDashboardIcon" style="display:flex; flex-shrink:0;"></span><span id="navDashboardLabel">Tableau de bord</span></div>
    </nav>

    <div class="px-5 pt-7 pb-2">
      <span class="eyebrow" id="clientsLabel">Clients</span>
    </div>
    <div id="clientList" class="flex flex-col gap-0.5 overflow-y-auto scrollbar-thin" style="max-height:calc(100vh - 430px);"></div>

    <div class="px-4 pt-5 flex flex-col gap-2">
      <button class="btn btn-primary w-full justify-center btn-sm" data-action="new-client" id="newClientBtn">+ Nouveau client</button>
      <button class="btn btn-ghost w-full justify-center btn-sm" data-action="load-example" id="loadExampleBtn">Charger client exemple</button>
    </div>

    <div class="px-5 pt-5 flex items-center gap-1" id="langSwitchSidebar"></div>

    <nav class="pt-3 pb-7 flex flex-col gap-1" style="border-top:1px solid var(--border); margin-top:.75rem; padding-top:1rem;">
      <div class="nav-item flex items-center gap-2.5" id="navSettings" data-action="go-settings"><span id="navSettingsIcon" style="display:flex; flex-shrink:0;"></span><span id="navSettingsLabel">Paramètres</span></div>
    </nav>
  </aside>

  <main id="main" class="flex-1 overflow-y-auto" style="padding:4rem 4.5rem; position:relative;"></main>
</div>

  let currentLang = (function(){

  function t(path, vars){
    const parts = path.split('.');
    let cur = I18N[currentLang];
    for(const p of parts){ cur = cur && cur[p]; }
    let str = (cur === undefined) ? path : cur;
    if(vars){ Object.keys(vars).forEach(k=>{ str = str.replace(new RegExp('\\{'+k+'\\}','g'), vars[k]); }); }
    return str;
  }
  function loc(){ return currentLang === 'en' ? 'en-US' : 'fr-FR'; }
  function setLang(lang){
    if(lang!=='fr' && lang!=='en') return;
    currentLang = lang;
    try{ localStorage.setItem("rapport_lang", lang); }catch(e){}
    document.documentElement.lang = lang;
    render();
  }

  /* ---------- Currency ---------- */
  const CURRENCIES = {
    EUR:{ symbol:"€", suffix:true, spaced:true },
    USD:{ symbol:"$", suffix:false, spaced:false },
    GBP:{ symbol:"£", suffix:false, spaced:false },
    MAD:{ symbol:"DH", suffix:true, spaced:true },
    CAD:{ symbol:"$", suffix:true, spaced:true },
    CHF:{ symbol:"CHF", suffix:true, spaced:true }
  };

    try{ const saved = localStorage.getItem("rapport_currency"); if(saved && CURRENCIES[saved]) return saved; }catch(e){}
    return 'EUR';
  })();

  /* ---------- Storage ---------- */
  const STORAGE_KEY = "rapport_data_v1";
  // Backwards-compatible migration: older saved reports/clients lack `notes` and
  // `goals`. We default them here on every load so existing localStorage data
  // keeps working without any manual migration step from the user.
  function migrateData(parsed){
    const clients = (parsed.clients||[]).map(c => ({ ...c, goals: Array.isArray(c.goals) ? c.goals : [] }));
    const reports = (parsed.reports||[]).map(r => ({ ...r, notes: typeof r.notes === 'string' ? r.notes : "" }));
    return { clients, reports };
  }
  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {clients:[], reports:[]};
      const parsed = JSON.parse(raw);
      return migrateData(parsed);
    }catch(e){ return {clients:[], reports:[]}; }
  }
  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ console.error("Local save failed", e); }

  let data = loadData();
  let state = { clientId: null, reportId: null, mode: "home" }; // mode: home|welcome|reports|form|preview|new-client|edit-client|settings
  let yearViewMetric = null; // selected metric on the "Vue annuelle" tab, resets to 'leads' per client

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  /* ---------- Utils: numbers & formatting ---------- */
  function toNum(v){
    if(v === "" || v === null || v === undefined) return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function isValidMetric(v, allowEmpty){
    if(v === "" || v === null || v === undefined) return allowEmpty;
    const n = Number(v);
    return Number.isFinite(n) && n >= 0;
  }
  function fmtInt(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : Math.round(v).toLocaleString(loc()); }
  function fmtDec(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function fmtCur(v){
    if(v===null||v===undefined||isNaN(v)) return "—";
    const num = v.toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2});
    const cur = CURRENCIES[currentCurrency] || CURRENCIES.EUR;
    const sep = cur.spaced ? " " : "";
    return cur.suffix ? (num + sep + cur.symbol) : (cur.symbol + sep + num);
  }
  function fmtPct(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}) + " %"; }
  function safeDiv(n, d){
    if(n===null||n===undefined||d===null||d===undefined||!Number.isFinite(n)||!Number.isFinite(d)||d===0) return null;
    return n/d;
  }
  function safePct(n, d){ const r = safeDiv(n,d); return r===null ? null : r*100; }
  function monthLabel(m){
    if(!m) return "—";
    const [y,mo] = m.split("-");
    const names = t('months');
    const idx = parseInt(mo,10)-1;
    return ((Array.isArray(names) && names[idx]) || mo) + " " + y;
  }
  function nextMonthStr(m){
    const [y,mo] = m.split("-").map(Number);
    const d = new Date(y, mo, 1);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function currentMonthStr(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function plural(n){ return n===1 ? '' : 's'; }

  /* ---------- Fix: KPI tiles auto-shrink to fit (no overflow/clipping on long numbers) ----------
     Two causes produced visible clipping before this fix: (1) no safety margin, so a value that
     fit by a sub-pixel still touched the card edge, and (2) the 'Outfit' webfont can finish loading
     AFTER this first runs, making the already-fitted text reflow wider than its shrunk box. Both are
     fixed by re-running this with a small pixel buffer once fonts are confirmed ready. */
  function fitKpiValues(){
    document.querySelectorAll('.kpi-value').forEach(el=>{
      const max = parseFloat(window.getComputedStyle(el).fontSize);
      let size = max;
      el.style.fontSize = size + 'px';
      // Stop at 92% of the available width, not 100% — shrinking until the text just barely
      // fits leaves the last character touching the card's edge, which reads as a bug even
      // though nothing is actually clipped. A real margin keeps it visually comfortable.
      const target = () => el.clientWidth * 0.92;
      let guard = 0;
      while(el.scrollWidth > target() && size > 14 && guard < 60){
        size -= 1;
        el.style.fontSize = size + 'px';
        guard++;
      }
    });
  }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitKpiValues).catch(()=>{});
  }

  /* ---------- Derived metrics ---------- */
  function computePlatform(p){
    const spend = toNum(p.spend), impressions = toNum(p.impressions), clicks = toNum(p.clicks), leads = toNum(p.leads);
    return {
      spend, impressions, clicks, leads,
      ctr: safePct(clicks, impressions),
      cpc: safeDiv(spend, clicks),
      cpl: safeDiv(spend, leads)
    };
  }
  function computeWebsite(w){
    const sessions = toNum(w.sessions), users = toNum(w.users), conversions = toNum(w.conversions);
    return { sessions, users, conversions, convRate: safePct(conversions, sessions) };
  }
  function computeEmail(e){
    return { sent: toNum(e.sent), openRate: toNum(e.openRate), clickRate: toNum(e.clickRate) };
  }
  function computeReport(r){
    return {
      meta: computePlatform(r.meta||{}),
      google: computePlatform(r.google||{}),
      website: computeWebsite(r.website||{}),
      email: computeEmail(r.email||{}),
      custom: (r.custom||[]).map(c=>({label:c.label, value: toNum(c.value)}))
    };
  }
  function getPreviousReport(report){
    const siblings = data.reports
      .filter(r => r.clientId === report.clientId && r.month < report.month)
      .sort((a,b) => a.month < b.month ? 1 : -1);
    return siblings[0] || null;
  }
  function delta(curr, prev){
    if(curr===null||prev===null||prev===0) return null;
    return ((curr-prev)/prev)*100;
  }
  function deltaBadge(d){
    if(d===null||isNaN(d)) return '<span class="text-muted text-xs">—</span>';
    const cls = d>0.001 ? "delta-up" : (d<-0.001 ? "delta-down" : "delta-flat");
    const arrow = d>0.001 ? "▲" : (d<-0.001 ? "▼" : "▬");
    return `<span class="delta ${cls} font-mono">${arrow} ${Math.abs(d).toLocaleString(loc(),{maximumFractionDigits:1})} %</span>`;
  }

  /* ---------- Feature 1: "What changed" summary (pure, deterministic) ---------- */
  const CHANGE_METRIC_DEFS = [
    { path:['meta','spend'], type:'cur', labelKey:'changes.metaSpend' },
    { path:['meta','clicks'], type:'int', labelKey:'changes.metaClicks' },
    { path:['meta','leads'], type:'int', labelKey:'changes.metaLeads' },
    { path:['google','spend'], type:'cur', labelKey:'changes.googleSpend' },
    { path:['google','clicks'], type:'int', labelKey:'changes.googleClicks' },
    { path:['google','leads'], type:'int', labelKey:'changes.googleLeads' },
    { path:['website','sessions'], type:'int', labelKey:'changes.sessions' },
    { path:['website','conversions'], type:'int', labelKey:'changes.conversions' },
    { path:['email','openRate'], type:'pct', labelKey:'changes.openRate' },
    { path:['email','clickRate'], type:'pct', labelKey:'changes.clickRate' }
  ];
  // Returns null when there's no previous report to compare against (caller shows the
  // "first report" message), or an array of up to 6 {label,type,curr,prev,pct} ranked by
  // |pct| descending. Metrics missing on either side, or with a zero previous value
  // (undefined % change), are silently skipped — never NaN, never a dash in this list.
  function computeTopChanges(d, dPrev){
    if(!dPrev) return null;
    const candidates = [];
    CHANGE_METRIC_DEFS.forEach(def=>{
      const curr = def.path.reduce((o,k)=> o && o[k] !== undefined ? o[k] : null, d);
      const prevVal = def.path.reduce((o,k)=> o && o[k] !== undefined ? o[k] : null, dPrev);
      if(curr===null||curr===undefined||isNaN(curr)) return;
      if(prevVal===null||prevVal===undefined||isNaN(prevVal)) return;
      const pct = delta(curr, prevVal);
      if(pct===null||isNaN(pct)) return;
      candidates.push({ label:t(def.labelKey), type:def.type, curr, prev:prevVal, pct });
    });
    (d.custom||[]).forEach(c=>{
      if(c.value===null||c.value===undefined||isNaN(c.value)) return;
      const prevItem = (dPrev.custom||[]).find(p=>p.label===c.label);
      if(!prevItem || prevItem.value===null||prevItem.value===undefined||isNaN(prevItem.value)) return;
      const pct = delta(c.value, prevItem.value);
      if(pct===null||isNaN(pct)) return;
      candidates.push({ label:c.label, type:'dec', curr:c.value, prev:prevItem.value, pct });
    });
    candidates.sort((a,b)=> Math.abs(b.pct) - Math.abs(a.pct));
    return candidates.slice(0,6);
  }
  function fmtByType(type, v){ return type==='cur' ? fmtCur(v) : (type==='pct' ? fmtPct(v) : fmtInt(v)); }
  function renderChangesSummary(d, dPrev){
    const changes = computeTopChanges(d, dPrev);
    if(changes === null){
      return `<p class="text-muted text-sm">${t('changes.noPrevious')}</p>`;
    }
    if(changes.length === 0){
      return `<p class="text-muted text-sm">${t('changes.none')}</p>`;
    }
    return `<ul style="list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.65rem;">
      ${changes.map(c=>{
        const arrow = c.pct>0.001 ? '▲' : (c.pct<-0.001 ? '▼' : '=');
        const arrowColor = c.pct>0.001 ? 'var(--success)' : (c.pct<-0.001 ? 'var(--danger)' : 'var(--muted)');
        const sign = c.pct>0 ? '+' : '';
        return `<li class="text-sm"><span class="font-mono" style="color:${arrowColor}; font-weight:700;">${arrow}</span> <strong>${escapeHtml(c.label)}</strong> : ${sign}${c.pct.toLocaleString(loc(),{maximumFractionDigits:1})} % <span class="text-muted font-mono">(${fmtByType(c.type,c.prev)} → ${fmtByType(c.type,c.curr)})</span></li>`;
      }).join("")}
    </ul>`;
  }

  /* ---------- Feature 2: Goals per client + progress ---------- */
  const BUILT_IN_GOAL_TYPES = {
    leads:{ direction:'more', labelKey:'goals.leadsLabel', fmtType:'int' },
    spend:{ direction:'less', labelKey:'goals.spendLabel', fmtType:'cur' },
    cpl:{ direction:'less', labelKey:'goals.cplLabel', fmtType:'cur' }
  };
  function goalDirection(goal){ return goal.type==='custom' ? (goal.direction||'more') : BUILT_IN_GOAL_TYPES[goal.type].direction; }
  function goalLabel(goal){ return goal.type==='custom' ? goal.label : t(BUILT_IN_GOAL_TYPES[goal.type].labelKey); }
  function goalFmtType(goal){ return goal.type==='custom' ? 'dec' : BUILT_IN_GOAL_TYPES[goal.type].fmtType; }
  // "more is better" (leads): reached when actual >= target. "less is better" (spend, CPL,
  // custom cost metrics): reached when actual <= target, exceeded (red) when actual > target.
  function resolveGoalStatus(goal, actual){
    const target = toNum(goal.target);
    if(actual===null||actual===undefined||isNaN(actual)||target===null||target<=0) return null;
    const direction = goalDirection(goal);
    const pct = Math.max(0, Math.min(100, (actual/target)*100));
    if(direction==='more'){
      return { status: actual>=target ? 'reached' : 'inprogress', pct, actual, target };
    }
    return { status: actual<=target ? 'reached' : 'exceeded', pct, actual, target };

  function renderGoalProgress(goal, actual){
    const r = resolveGoalStatus(goal, actual);
    if(!r) return '';
    const fmtType = goalFmtType(goal);
    const fmt = v => fmtByType(fmtType, v);
    const statusKey = r.status==='reached' ? 'reached' : (r.status==='exceeded' ? 'exceeded' : 'inProgress');
    const statusClass = r.status==='reached' ? 'goal-status-reached' : (r.status==='exceeded' ? 'goal-status-exceeded' : 'goal-status-inprogress');
    const fillColor = r.status==='reached' ? 'var(--success)' : (r.status==='exceeded' ? 'var(--danger)' : 'var(--warn)');
    return `<div class="mt-3">
      <div class="goal-bar-track"><div class="goal-bar-fill" style="width:${r.pct}%; background:${fillColor};"></div></div>
      <div class="flex items-center justify-between mt-2">
        <span class="badge goal-status ${statusClass}">${t('goals.'+statusKey)}</span>
        <span class="text-muted text-xs font-mono">${fmt(r.actual)} / ${fmt(r.target)}</span>
      </div>
    </div>`;
  }

  /* ---------- Scroll reveal ---------- */
  let revealObserver = null;
  function initRevealObserver(){
    if(revealObserver || !('IntersectionObserver' in window)) return;
    revealObserver = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){ entry.target.classList.add('reveal-visible'); revealObserver.unobserve(entry.target); }
      });
    }, { threshold: 0.12 });
  }
  function observeReveals(root){
    initRevealObserver();
    const els = root.querySelectorAll('.reveal');
    if(!revealObserver){ els.forEach(el=>el.classList.add('reveal-visible')); return; }
    els.forEach(el=>revealObserver.observe(el));
  }

  /* ---------- Chart.js defensive wrapper ----------
     Chart.js loads from a CDN; if that request is blocked (ad-blocker, offline, corporate
     firewall) or the script otherwise fails, `Chart` stays undefined and `new Chart(...)`
     throws. Previously that exception propagated straight out of whichever render function
     was building charts, leaving every canvas on the page a silent blank box with no
     explanation — and, since the throw happened mid-function, it could even skip unrelated
     code that ran after it (like the KPI auto-fit sizing). safeChart() runs any chart-creation
     block in isolation: on failure it prints one console.error for debugging and swaps each
     canvas for a visible "Graphiques indisponibles" message, so a CDN hiccup degrades
     gracefully instead of silently breaking the page. */
  function safeChart(fn){
    try{
      if(typeof Chart === 'undefined') throw new Error('Chart.js failed to load (CDN blocked or offline)');
      fn();
    }catch(err){
      console.error('Chart rendering failed:', err);
      document.querySelectorAll('canvas').forEach(canvas=>{
        if(canvas.dataset.chartFallbackShown) return;
        canvas.dataset.chartFallbackShown = '1';
        const msg = document.createElement('p');
        msg.className = 'text-muted text-sm';
        msg.style.textAlign = 'center';
        msg.style.padding = '1.5rem 0';
        msg.textContent = t('charts.unavailable');
        canvas.replaceWith(msg);
      });
    }
  }

  function latestReportFor(clientId){
    return data.reports.filter(r=>r.clientId===clientId).sort((a,b)=> a.month < b.month ? 1 : -1)[0] || null;

  function renderClientForm(main, existing){
    main.innerHTML = `
      <div class="surface card p-8" style="max-width:460px;">
        <h2 class="headline font-bold mb-7" style="font-size:1.9rem;">${existing ? t('clientForm.editTitle') : t('clientForm.newTitle')}</h2>

          </div>
          <div class="flex gap-2 mt-2 flex-wrap">
            <button type="submit" class="btn btn-primary">${t('clientForm.save')}</button>
            <button type="button" class="btn btn-ghost" id="cancelClient">${t('clientForm.cancel')}</button>
            ${existing && !existing.isExample ? `<button type="button" class="btn btn-danger" id="deleteClient">${t('clientForm.deleteClient')}</button>` : ''}
          </div>
        </form>
        ${existing ? renderGoalsSection(existing) : ''}
      </div>`;
    document.getElementById("cancelClient").onclick = () => {
      state.mode = state.clientId ? "reports" : "welcome";
      render();
    };
    if(existing && !existing.isExample){
      document.getElementById("deleteClient").onclick = () => {
        if(!confirm(t('clientForm.confirmDelete',{name:existing.name}))) return;
        data.clients = data.clients.filter(c=>c.id!==existing.id);
        data.reports = data.reports.filter(r=>r.clientId!==existing.id);
        saveData();
        state = {clientId:null, reportId:null, mode:"welcome"};
        render();
      };
    }
    document.getElementById("clientForm").onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = (fd.get("name")||"").toString().trim();
      const errEl = e.target.querySelector('[data-err="name"]');
      const nameInput = e.target.querySelector('[name="name"]');
      if(!name){
        errEl.textContent = t('clientForm.nameRequired');
        errEl.classList.remove("hidden");
        nameInput.classList.add("field-err");
        return;
      }
      errEl.classList.add("hidden");
      nameInput.classList.remove("field-err");
      const logo = (fd.get("logo")||"").toString().trim();
      const color = (fd.get("color")||"#2D7FE0").toString();
      if(existing){
        existing.name = name; existing.logo = logo; existing.color = color;
      }else{
        const c = { id: uid("client"), name, logo, color, isExample:false, goals:[] };
        data.clients.push(c);
        state.clientId = c.id;
      }
      saveData();
      state.mode = "reports";
      render();
    };

    if(existing){
      const typeSelect = document.getElementById("newGoalType");
      const customNameWrap = document.getElementById("newGoalCustomName");
      const directionWrap = document.getElementById("newGoalDirectionWrap");
      function syncGoalFormVisibility(){
        const isCustom = typeSelect.value === 'custom';
        customNameWrap.classList.toggle('hidden', !isCustom);
        directionWrap.classList.toggle('hidden', !isCustom);
      }
      typeSelect.onchange = syncGoalFormVisibility;
      syncGoalFormVisibility();

      document.getElementById("addGoalBtn").onclick = () => {
        const type = typeSelect.value;
        const targetInput = document.getElementById("newGoalTarget");
        const target = toNum(targetInput.value);
        if(target===null || target<=0){ targetInput.classList.add("field-err"); return; }
        targetInput.classList.remove("field-err");
        const goal = { id: uid("goal"), type, target };
        if(type==='custom'){
          const label = document.getElementById("newGoalLabel").value.trim();
          if(!label) return;
          goal.label = label;
          goal.direction = document.getElementById("newGoalDirection").value;
        }
        existing.goals = existing.goals || [];
        existing.goals.push(goal);
        saveData();
        renderClientForm(main, existing);
      };

      document.querySelectorAll('[data-remove-goal]').forEach(btn=>{
        btn.onclick = () => {
          existing.goals = (existing.goals||[]).filter(g=>g.id!==btn.dataset.removeGoal);
          saveData();
          renderClientForm(main, existing);
        };
      });
    }
  }

  /* ---------- Reports list ---------- */
  function getYearMetricOptions(reports){
    const opts = [
      { value:'leads', label:t('yearView.metricLeads') },
      { value:'spend', label:t('yearView.metricSpend') },
      { value:'cpl', label:t('yearView.metricCpl') },
      { value:'conversions', label:t('yearView.metricConversions') }
    ];
    const customLabels = new Set();
    reports.forEach(r => (r.custom||[]).forEach(c => { if(c.label) customLabels.add(c.label); }));
    customLabels.forEach(label => opts.push({ value:'custom:'+label, label }));
    return opts;
  }
  function getYearMetricValue(report, metricKey){
    const d = computeReport(report);
    const totalSpend = (d.meta.spend||0) + (d.google.spend||0);
    const totalLeads = (d.meta.leads||0) + (d.google.leads||0);
    if(metricKey==='leads') return totalLeads;
    if(metricKey==='spend') return totalSpend;
    if(metricKey==='cpl') return safeDiv(totalSpend, totalLeads);
    if(metricKey==='conversions') return d.website.conversions;
    if(metricKey.startsWith('custom:')){
      const label = metricKey.slice(7);
      const item = (d.custom||[]).find(c=>c.label===label);
      return item ? item.value : null;
    }
    return null;
  }
  let yearChartInstance = null;
  function renderYearChart(client, reports, metricKey){
    if(yearChartInstance){ yearChartInstance.destroy(); yearChartInstance = null; }
    const canvas = document.getElementById('yearChart');
    if(!canvas) return;
    safeChart(() => {
      const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#E7EDF3';
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2D7FE0';
      const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#6D7178';
      Chart.defaults.color = muted;
      Chart.defaults.font.family = "'Inter', sans-serif";
      yearChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: reports.map(r=>monthLabel(r.month)),
          datasets: [{ data: reports.map(r=>getYearMetricValue(r, metricKey) || 0), backgroundColor: client.color||accentColor, borderRadius:8, maxBarThickness:48 }]
        },
        options: {
          plugins:{ legend:{display:false} },
          scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5}, ticks:{font:{family:"'IBM Plex Mono', monospace"}} }, x:{ border:{display:false}, grid:{display:false} } }
        }
      });
    });
  }
  // Always-visible spend chart on the client's main "Rapports" tab — unlike the Vue
  // annuelle tab (which needs 2+ reports to show a trend), this renders from the very
  // first saved report, so graphics appear immediately rather than only after opening
  // an individual report's preview.
  let clientSpendChartInstance = null;
  function renderClientSpendChart(client, reports){
    if(clientSpendChartInstance){ clientSpendChartInstance.destroy(); clientSpendChartInstance = null; }
    const canvas = document.getElementById('clientSpendChart');
    if(!canvas) return;
    safeChart(() => {
      const chronological = reports.slice().sort((a,b)=> a.month < b.month ? -1 : 1);
      const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#E7EDF3';
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2D7FE0';
      const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#6D7178';
      Chart.defaults.color = muted;
      Chart.defaults.font.family = "'Inter', sans-serif";
      const ctx2d = canvas.getContext('2d');
      const grad = ctx2d.createLinearGradient(0,0,0,160);
      const barColor = client.color || accentColor;
      grad.addColorStop(0, barColor+'CC');
      grad.addColorStop(1, barColor+'66');
      clientSpendChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: chronological.map(r=>monthLabel(r.month)),
          datasets: [{
            data: chronological.map(r=>{ const cd = computeReport(r); return (cd.meta.spend||0)+(cd.google.spend||0); }),
            backgroundColor: grad, borderRadius:8, maxBarThickness:56
          }]

        options: {
          plugins:{ legend:{display:false} },
          scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5}, ticks:{font:{family:"'IBM Plex Mono', monospace"}} }, x:{ border:{display:false}, grid:{display:false} } }
        }
      });
    });
  }
  function renderYearSummary(reports, metricKey){

    main.innerHTML = header + `

          <p class="text-muted text-sm mt-3">${t('reportsList.emptyDesc')}</p>

      ` : `
        <div class="surface card p-6 mb-6">
          <p class="eyebrow mb-4">${t('reportsList.spendChartTitle')}</p>

        <div class="grid gap-4" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));">
          ${reports.map(r => {
            const d = computeReport(r);
            const totalSpend = (d.meta.spend||0) + (d.google.spend||0);
            return `
            <div class="surface card p-6 flex flex-col gap-3 cursor-pointer" data-action="open-report" data-id="${r.id}">
              <div class="flex items-center justify-between">

                ${r.isExample?'<span class="badge badge-example">EX</span>':''}

    if(reports.length > 0) renderClientSpendChart(client, reports);
  }

  /* ---------- Report form ---------- */
  function emptyReport(clientId){
    return {
      id: uid("report"), clientId, month: "", isExample:false,
      meta:{spend:"",impressions:"",clicks:"",leads:""},
      google:{spend:"",impressions:"",clicks:"",leads:""},
      website:{sessions:"",users:"",conversions:""},
      email:{sent:"",openRate:"",clickRate:""},
      custom:[], notes:""
    };
  }

  const FIELD_DEFS = [
    ["meta","spend"],["meta","impressions"],["meta","clicks"],["meta","leads"],
    ["google","spend"],["google","impressions"],["google","clicks"],["google","leads"],
    ["website","sessions"],["website","users"],["website","conversions"],
    ["email","sent"],["email","openRate"],["email","clickRate"]
  ];
  // Qualified synonyms ("meta spend") disambiguate columns in a single multi-platform
  // sheet (Excel import). Bare synonyms ("dépense", "spend") only apply when the platform
  // is already fixed by context — the per-section "paste" feature, where the user pastes
  // directly into a specific platform's panel, so no column can be ambiguous there. They're
  // listed here too because the Excel importer's guessColumn() already excludes columns
  // naming the other platform, so bare terms stay safe for both use sites.
  const FIELD_SYNONYMS = {
    "meta.spend":["meta spend","facebook spend","amount spent (meta)","dépense meta","spend meta","dépense","spend","cost","amount spent"],
    "meta.impressions":["meta impressions","facebook impressions","impressions"],
    "meta.clicks":["meta clicks","facebook clicks","meta clics","link clicks (meta)","clics","clicks"],
    "meta.leads":["meta leads","meta results","facebook leads","leads","results"],
    "google.spend":["google spend","adwords spend","dépense google","cost (google)","dépense","spend","cost"],
    "google.impressions":["google impressions","adwords impressions","impressions"],
    "google.clicks":["google clicks","adwords clicks","google clics","clics","clicks"],
    "google.leads":["google leads","google conversions","adwords leads","leads"],
    "website.sessions":["sessions"],
    "website.users":["users","utilisateurs"],
    "website.conversions":["conversions"],
    "email.sent":["sent","envoyés","emails sent"],
    "email.openRate":["open rate","taux d'ouverture","open %"],
    "email.clickRate":["click rate","taux de clic","ctr email"]
  };

  function platformFieldsHtml(prefix, label, p, fieldKeys){
    return `
      <fieldset class="surface card p-6">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <span class="eyebrow">${label}</span>
          <button type="button" class="btn btn-ghost btn-sm" data-paste-toggle="${prefix}">${t('reportForm.pasteToggle')}</button>
        </div>
        <div id="pasteArea-${prefix}" class="paste-panel hidden">
          <label class="field-label">${t('reportForm.pasteLabel')}</label>
          <textarea id="pasteInput-${prefix}" placeholder="${t('reportForm.pastePlaceholder')}"></textarea>
          <div class="flex gap-2 mt-2">
            <button type="button" class="btn btn-primary btn-sm" data-paste-analyze="${prefix}">${t('reportForm.pasteAnalyze')}</button>
            <button type="button" class="btn btn-ghost btn-sm" data-paste-cancel="${prefix}">${t('reportForm.cancel')}</button>
          </div>
          <div id="pastePreview-${prefix}" class="mt-3"></div>
        </div>
        <div class="grid gap-4 mt-3" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">
          ${fieldKeys.map(key=>`
            <div>
              <label class="field-label">${t('reportForm.'+key)}</label>
              <input type="number" min="0" step="any" name="${prefix}.${key}" value="${p[key]!==undefined && p[key]!==null ? p[key] : ''}" data-metric="${prefix}.${key}">
              <div class="err-msg hidden" data-err="${prefix}.${key}"></div>
            </div>
          `).join("")}
        </div>
      </fieldset>`;
  }

  /* ---------- Feature 4B: paste-from-spreadsheet parsing ---------- */
  const PASTE_FIELD_KEYS = {};
  FIELD_DEFS.forEach(([section,key])=>{ (PASTE_FIELD_KEYS[section] = PASTE_FIELD_KEYS[section]||[]).push(key); });

  function parsePasteBlock(raw){
    const lines = raw.replace(/\r\n/g,'\n').split('\n').filter(l=>l.trim()!=='');
    if(lines.length < 2) return null;
    const delim = lines[0].includes('\t') ? '\t' : ',';
    return { headers: lines[0].split(delim).map(h=>h.trim()), values: lines[1].split(delim).map(v=>v.trim()) };
  }
  function matchPasteColumn(prefix, key, header){
    const h = header.toLowerCase().trim();
    if(!h) return false;
    if(h === t('reportForm.'+key).toLowerCase()) return true;
    const syn = FIELD_SYNONYMS[prefix+'.'+key] || [];
    return syn.some(s => h.includes(s));
  }

  function renderReportForm(main, client, reportId){
    const existing = reportId ? data.reports.find(r=>r.id===reportId) : null;
    const r = existing ? JSON.parse(JSON.stringify(existing)) : emptyReport(client.id);
    const customRows = r.custom && r.custom.length ? r.custom : [];
    const latestPrior = !existing ? data.reports.filter(rep=>rep.clientId===client.id).sort((a,b)=> a.month < b.month ? 1 : -1)[0] : null;

    main.innerHTML = `
      <div class="flex items-center justify-between mb-8 flex-wrap gap-2">
        <h2 class="headline font-bold" style="font-size:2rem;">${existing ? t('reportForm.editTitle') : t('reportForm.newTitle')} — ${escapeHtml(client.name)}</h2>
        <div class="flex gap-2 flex-wrap">
          <button type="button" class="btn btn-ghost btn-sm" id="importFileBtn">${t('reportForm.importFile')}</button>
          <input type="file" id="importFileInput" accept=".xlsx,.xls,.csv" class="hidden">
          ${latestPrior ? `<button type="button" class="btn btn-ghost btn-sm" id="duplicateLastMonth">${t('reportForm.duplicateLastMonth')}</button>` : ''}
          <button class="btn btn-ghost btn-sm" data-action="back-to-reports">${t('reportForm.back')}</button>
        </div>
      </div>
      <form id="reportForm" class="flex flex-col gap-5" style="max-width:720px;">
        <div class="surface card p-6">
          <label class="field-label">${t('reportForm.monthLabel')}</label>
          <input type="month" name="month" required value="${r.month||''}" style="max-width:220px;">
          <div class="err-msg hidden" data-err="month"></div>
        </div>

        ${platformFieldsHtml("meta", t('reportForm.metaAds'), r.meta, ["spend","impressions","clicks","leads"])}
        ${platformFieldsHtml("google", t('reportForm.googleAds'), r.google, ["spend","impressions","clicks","leads"])}
        ${platformFieldsHtml("website", t('reportForm.website'), r.website, ["sessions","users","conversions"])}
        ${platformFieldsHtml("email", t('reportForm.email'), r.email, ["sent","openRate","clickRate"])}

        <fieldset class="surface card p-6">
          <legend class="eyebrow px-1">${t('reportForm.customMetrics')}</legend>
          <div id="customRows" class="flex flex-col gap-2 mt-3"></div>
          <button type="button" class="btn btn-ghost btn-sm mt-3" id="addCustomRow">${t('reportForm.addMetric')}</button>
        </fieldset>

        <div class="surface card p-6">
          <label class="field-label">${t('reportForm.notesLabel')}</label>
          <textarea name="notes" rows="4" placeholder="${t('reportForm.notesPlaceholder')}" style="min-height:90px; resize:vertical;">${escapeHtml(r.notes||'')}</textarea>
        </div>

        <div class="flex gap-2">
          <button type="submit" class="btn btn-primary">${t('reportForm.save')}</button>
          <button type="button" class="btn btn-ghost" id="cancelReport">${t('reportForm.cancel')}</button>
        </div>
      </form>
    `;

    const customContainer = document.getElementById("customRows");
    function addCustomRow(label="", value=""){
      const row = document.createElement("div");
      row.className = "flex gap-2 items-start custom-row";
      row.innerHTML = `
        <input type="text" class="custom-label" placeholder="${t('reportForm.metricNamePlaceholder')}" value="${escapeAttr(label)}" style="flex:2;">
        <input type="number" step="any" class="custom-value" placeholder="${t('reportForm.valuePlaceholder')}" value="${value}" style="flex:1;">
        <button type="button" class="btn btn-danger btn-sm remove-row">✕</button>
      `;
      row.querySelector(".remove-row").onclick = () => row.remove();
      customContainer.appendChild(row);
    }
    customRows.forEach(c => addCustomRow(c.label, c.value===null||c.value===undefined?"":c.value));
    document.getElementById("addCustomRow").onclick = () => addCustomRow();

    const dupBtn = document.getElementById("duplicateLastMonth");
    if(dupBtn){
      dupBtn.onclick = () => {
        const form = document.getElementById("reportForm");
        const monthField = form.querySelector('[name="month"]');
        if(!monthField.value) monthField.value = nextMonthStr(latestPrior.month);
        ["meta","google","website","email"].forEach(section=>{
          Object.keys(latestPrior[section]||{}).forEach(key=>{
            const input = form.querySelector(`[name="${section}.${key}"]`);
            if(input) input.value = latestPrior[section][key] ?? "";
          });
        });
        customContainer.innerHTML = "";
        (latestPrior.custom||[]).forEach(c => addCustomRow(c.label, c.value===null||c.value===undefined?"":c.value));
      };
    }

    /* ---- Excel / CSV import ---- */
    document.getElementById("importFileBtn").onclick = () => document.getElementById("importFileInput").click();
    document.getElementById("importFileInput").onchange = (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try{
          const wb = XLSX.read(ev.target.result, {type:"array"});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""})
            .map(row => row.map(cell => cell===null||cell===undefined ? "" : cell))
            .filter(row => row.some(cell => String(cell).trim() !== ""));
          if(rows.length === 0){ alert(t('importModal.noData')); return; }
          openImportModal(rows, document.getElementById("reportForm"));
        }catch(err){
          alert(t('importModal.parseError'));
        }
      };
      reader.readAsArrayBuffer(file);
    };

    /* ---- Paste-from-spreadsheet import (per platform section) ---- */
    document.getElementById("reportForm").addEventListener("click", (e) => {
      const toggleBtn = e.target.closest('[data-paste-toggle]');
      if(toggleBtn){
        document.getElementById('pasteArea-'+toggleBtn.dataset.pasteToggle).classList.toggle('hidden');
        return;
      }
      const cancelBtn = e.target.closest('[data-paste-cancel]');
      if(cancelBtn){
        const prefix = cancelBtn.dataset.pasteCancel;
        document.getElementById('pasteArea-'+prefix).classList.add('hidden');
        document.getElementById('pastePreview-'+prefix).innerHTML = '';
        document.getElementById('pasteInput-'+prefix).value = '';
        return;
      }
      const analyzeBtn = e.target.closest('[data-paste-analyze]');
      if(analyzeBtn){
        e.preventDefault();
        const prefix = analyzeBtn.dataset.pasteAnalyze;
        const raw = document.getElementById('pasteInput-'+prefix).value;
        const previewEl = document.getElementById('pastePreview-'+prefix);
        const parsed = parsePasteBlock(raw);
        if(!parsed){ previewEl.innerHTML = `<p class="err-msg">${t('reportForm.pasteNoRows')}</p>`; return; }
        const keys = PASTE_FIELD_KEYS[prefix] || [];
        const mapped = {}; const unmapped = [];
        parsed.headers.forEach((h,i)=>{
          const key = keys.find(k => matchPasteColumn(prefix, k, h));
          if(key && parsed.values[i] !== undefined) mapped[key] = parsed.values[i];
          else if(h.trim() !== '') unmapped.push(h);
        });
        let html = '';
        if(Object.keys(mapped).length){
          html += `<ul style="list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.3rem;">`;
          html += Object.keys(mapped).map(k=>`<li class="text-sm"><strong>${t('reportForm.'+k)}</strong> : <span class="font-mono">${escapeHtml(mapped[k])}</span></li>`).join('');
          html += `</ul>`;
        }
        if(unmapped.length){
          html += `<p class="text-muted text-xs mt-2">${t('reportForm.pasteUnmapped')} : ${unmapped.map(escapeHtml).join(', ')}</p>`;
        }
        if(Object.keys(mapped).length){
          html += `<button type="button" class="btn btn-primary btn-sm mt-3" data-paste-fill="${prefix}">${t('reportForm.pasteFill')}</button>`;
        }
        previewEl.innerHTML = html;
        previewEl.dataset.mapped = JSON.stringify(mapped);
        return;
      }
      const fillBtn = e.target.closest('[data-paste-fill]');
      if(fillBtn){
        e.preventDefault();
        const prefix = fillBtn.dataset.pasteFill;
        const previewEl = document.getElementById('pastePreview-'+prefix);
        const mapped = JSON.parse(previewEl.dataset.mapped || '{}');
        const formEl = document.getElementById("reportForm");
        const keys = Object.keys(mapped);
        const doFill = () => {
          keys.forEach(k=>{
            const input = formEl.querySelector(`[name="${prefix}.${k}"]`);
            if(input) input.value = mapped[k];
          });
          document.getElementById('pasteArea-'+prefix).classList.add('hidden');
          previewEl.innerHTML = '';
        };
        const hasExisting = keys.some(k=>{
          const input = formEl.querySelector(`[name="${prefix}.${k}"]`);
          return input && input.value !== '';
        });
        if(!hasExisting){ doFill(); return; }
        previewEl.innerHTML = `
          <p class="text-sm mb-2">${t('reportForm.pasteConfirmOverwrite')}</p>
          <div class="flex gap-2">
            <button type="button" class="btn btn-primary btn-sm" id="pasteConfirmYes">${t('common.yes')}</button>
            <button type="button" class="btn btn-ghost btn-sm" id="pasteConfirmNo">${t('common.no')}</button>
          </div>`;
        document.getElementById('pasteConfirmYes').onclick = doFill;
        document.getElementById('pasteConfirmNo').onclick = () => { previewEl.innerHTML = ''; };
        return;
      }
    });

    document.getElementById("cancelReport").onclick = () => { state.mode = "reports"; render(); };

    document.getElementById("reportForm").onsubmit = (e) => {
      e.preventDefault();
      const form = e.target;
      let hasError = false;
      form.querySelectorAll(".err-msg").forEach(el=>el.classList.add("hidden"));
      form.querySelectorAll("input").forEach(el=>el.classList.remove("field-err"));

      const monthInput = form.querySelector('[name="month"]');
      if(!monthInput.value){
        showErr(form, "month", t('reportForm.monthRequired'));
        monthInput.classList.add("field-err");
        hasError = true;
      }

      const metricFields = form.querySelectorAll('[data-metric]');
      metricFields.forEach(input => {
        const v = input.value;
        if(!isValidMetric(v, true)){
          showErr(form, input.dataset.metric, t('reportForm.metricPositive'));
          input.classList.add("field-err");
          hasError = true;
        }
      });

      // email rates should not exceed 100
      ["email.openRate","email.clickRate"].forEach(key=>{
        const input = form.querySelector(`[data-metric="${key}"]`);
        if(input && input.value !== "" && Number(input.value) > 100){
          showErr(form, key, t('reportForm.metricRange'));
          input.classList.add("field-err");
          hasError = true;
        }
      });

      if(hasError) return;

      const fd = new FormData(form);
      function g(name){ const v = fd.get(name); return v===null||v==="" ? "" : v; }

      const newReport = {
        id: r.id, clientId: client.id, month: fd.get("month"), isExample: existing ? existing.isExample : false,
        meta: { spend:g("meta.spend"), impressions:g("meta.impressions"), clicks:g("meta.clicks"), leads:g("meta.leads") },
        google: { spend:g("google.spend"), impressions:g("google.impressions"), clicks:g("google.clicks"), leads:g("google.leads") },
        website: { sessions:g("website.sessions"), users:g("website.users"), conversions:g("website.conversions") },
        email: { sent:g("email.sent"), openRate:g("email.openRate"), clickRate:g("email.clickRate") },
        custom: Array.from(customContainer.querySelectorAll(".custom-row")).map(row => ({
          label: row.querySelector(".custom-label").value.trim(),
          value: row.querySelector(".custom-value").value
        })).filter(c => c.label !== ""),
        notes: (fd.get("notes")||"").toString()
      };

      // prevent duplicate month for same client (except when editing same report)
      const dup = data.reports.find(rep => rep.clientId===client.id && rep.month===newReport.month && rep.id!==newReport.id);
      if(dup){
        showErr(form, "month", t('reportForm.monthDuplicate'));
        monthInput.classList.add("field-err");
        return;
      }

      if(existing){
        const idx = data.reports.findIndex(rep=>rep.id===existing.id);
        data.reports[idx] = newReport;
      }else{
        data.reports.push(newReport);
      }
      saveData();
      state.reportId = newReport.id;
      state.mode = "preview";
      render();
    };

    function showErr(form, key, msg){
      const el = form.querySelector(`[data-err="${key}"]`);
      if(el){ el.textContent = msg; el.classList.remove("hidden"); }
    }
  }

  /* ---------- Import mapping modal ---------- */
  function guessColumn(headerRow, fieldKey){
    const synonyms = FIELD_SYNONYMS[fieldKey] || [];
    const platform = fieldKey.split('.')[0]; // meta | google | website | email
    for(let i=0;i<headerRow.length;i++){
      const h = String(headerRow[i]).toLowerCase().trim();
      if(!h) continue;
      const matchesSynonym = synonyms.some(s => h.includes(s));
      if(matchesSynonym){
        if(platform==='meta' && /google|adwords/.test(h)) continue;
        if(platform==='google' && /meta|facebook/.test(h)) continue;
        return i;
      }
    }
    return -1;
  }

  function openImportModal(rows, form){
    const headerRow = rows[0] || [];
    const defaultDataRow = rows.length > 1 ? 1 : 0;

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop no-print";
    backdrop.innerHTML = `
      <div class="modal-panel">
        <h3 class="headline font-bold mb-2" style="font-size:1.4rem;">${t('importModal.title')}</h3>
        <p class="text-muted text-sm mb-5">${t('importModal.desc')}</p>

        <label class="field-label">${t('importModal.rowLabel')}</label>
        <select id="importRowSelect" class="mb-5">
          ${rows.map((row,i)=>`<option value="${i}" ${i===defaultDataRow?'selected':''}>${escapeHtml(t('importModal.rowOption',{n:i+1, preview:row.slice(0,4).join(', ')}))}</option>`).join("")}
        </select>

        <div id="importFieldMaps"></div>

        <div class="flex gap-2 mt-6">
          <button type="button" class="btn btn-primary" id="importConfirmBtn">${t('importModal.confirm')}</button>
          <button type="button" class="btn btn-ghost" id="importCancelBtn">${t('clientForm.cancel')}</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);

    const mapsEl = backdrop.querySelector("#importFieldMaps");
    mapsEl.innerHTML = FIELD_DEFS.map(([section,key])=>{
      const fieldKey = section+'.'+key;
      const guessed = guessColumn(headerRow, fieldKey);
      return `
        <div class="map-row">
          <label class="field-label" style="margin-bottom:0;">${t('reportForm.'+(section==='meta'||section==='google'?(section==='meta'?'metaAds':'googleAds'):section==='website'?'website':'email'))} — ${t('reportForm.'+key)}</label>
          <select data-field="${fieldKey}">
            <option value="">${t('common.ignore')}</option>
            ${headerRow.map((h,i)=>`<option value="${i}" ${i===guessed?'selected':''}>${escapeHtml(String(h) || ('Col ' + (i+1)))}</option>`).join("")}
          </select>
        </div>`;
    }).join("");

    function closeModal(){ backdrop.remove(); }
    backdrop.addEventListener("click", (e) => { if(e.target === backdrop) closeModal(); });
    backdrop.querySelector("#importCancelBtn").onclick = closeModal;
    backdrop.querySelector("#importConfirmBtn").onclick = () => {
      const rowIdx = parseInt(backdrop.querySelector("#importRowSelect").value, 10);
      const dataRow = rows[rowIdx] || [];
      mapsEl.querySelectorAll('[data-field]').forEach(sel => {
        const colIdx = sel.value;
        if(colIdx === "") return;
        const val = dataRow[parseInt(colIdx,10)];
        if(val === undefined) return;
        const input = form.querySelector(`[name="${sel.dataset.field}"]`);
        if(input) input.value = String(val).trim();
      });
      closeModal();
      alert(t('importModal.imported'));
    };
  }

  /* ---------- Report preview ---------- */
  let chartInstances = [];
  function destroyCharts(){ chartInstances.forEach(c=>c.destroy()); chartInstances = []; }

  function renderReportPreview(main, client, reportId){
    const report = data.reports.find(r=>r.id===reportId);
    if(!report){ state.mode = "reports"; return render(); }
    const d = computeReport(report);
    const prev = getPreviousReport(report);
    const dPrev = prev ? computeReport(prev) : null;

    const totalSpend = (d.meta.spend||0) + (d.google.spend||0);
    const totalLeads = (d.meta.leads||0) + (d.google.leads||0);
    const blendedCpl = safeDiv(totalSpend, totalLeads);

    const prevTotalSpend = dPrev ? (dPrev.meta.spend||0) + (dPrev.google.spend||0) : null;
    const prevTotalLeads = dPrev ? (dPrev.meta.leads||0) + (dPrev.google.leads||0) : null;

    const goals = client.goals || [];
    const spendGoal = goals.find(g=>g.type==='spend');
    const leadsGoal = goals.find(g=>g.type==='leads');
    const cplGoal = goals.find(g=>g.type==='cpl');

    main.innerHTML = `
      <div class="flex items-center justify-between mb-5 no-print flex-wrap gap-2">
        <button class="btn btn-ghost btn-sm" data-action="back-to-reports">${t('preview.back')}</button>
        <div class="flex gap-2">
          <button class="btn btn-ghost btn-sm" data-action="edit-report" data-id="${report.id}">${t('preview.edit')}</button>
          <button class="btn btn-primary btn-sm" data-action="export-csv" data-id="${report.id}">${t('preview.exportCsv')}</button>
        </div>
      </div>

      <div class="no-print surface card text-sm flex items-center gap-2.5 mb-8" style="color:var(--muted); padding:.9rem 1.25rem;">
        <span style="width:1.5rem; height:1.5rem; border-radius:999px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.75rem; flex-shrink:0;">i</span>
        <span>${t('preview.pdfNote')}</span>
      </div>

      <div id="reportSheet" class="surface card" style="max-width:920px; padding:3rem; overflow:hidden; position:relative;">
        <div style="position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg, ${escapeAttr(client.color||'#2D7FE0')}, var(--accent-2));"></div>
        <div class="flex items-center justify-between mb-2 flex-wrap gap-3">
          <div style="min-width:0;">
            <h2 class="headline font-bold" style="font-size:2.5rem; line-height:1.1; overflow-wrap:break-word;">${escapeHtml(client.name)}</h2>
            <p class="text-muted mt-3" style="font-size:1.02rem;">${t('preview.monthly',{month:monthLabel(report.month)})} ${report.isExample?`<span class="badge badge-example">${t('common.example')}</span>`:''}</p>
          </div>
        </div>

        <div class="grid gap-4 mt-10 mb-4" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));">
          <div class="kpi-card">
            <span class="eyebrow">${t('preview.kpiSpend')}</span>
            <p class="kpi-value">${fmtCur(totalSpend)}</p>
            ${deltaBadge(delta(totalSpend, prevTotalSpend))}
            ${spendGoal ? renderGoalProgress(spendGoal, totalSpend) : ''}
          </div>
          <div class="kpi-card">
            <span class="eyebrow">${t('preview.kpiLeads')}</span>
            <p class="kpi-value">${fmtInt(totalLeads)}</p>
            ${deltaBadge(delta(totalLeads, prevTotalLeads))}
            ${leadsGoal ? renderGoalProgress(leadsGoal, totalLeads) : ''}
          </div>
          <div class="kpi-card">
            <span class="eyebrow">${t('preview.kpiCpl')}</span>
            <p class="kpi-value">${fmtCur(blendedCpl)}</p>
            ${deltaBadge(delta(blendedCpl, dPrev ? safeDiv(prevTotalSpend, prevTotalLeads) : null))}
            ${cplGoal ? renderGoalProgress(cplGoal, blendedCpl) : ''}
          </div>
          <div class="kpi-card">
            <span class="eyebrow">${t('preview.kpiConversions')}</span>
            <p class="kpi-value">${fmtInt(d.website.conversions)}</p>
            ${deltaBadge(delta(d.website.conversions, dPrev ? dPrev.website.conversions : null))}
          </div>
        </div>

        <div class="flex flex-col gap-4 mt-6">
          <div class="surface card p-6">
            <p class="eyebrow mb-4">${t('changes.title')}</p>
            ${renderChangesSummary(d, dPrev)}
          </div>
          ${report.notes ? `<div class="surface card p-6"><p class="eyebrow mb-3">${t('reportForm.notesLabel')}</p><p class="text-sm" style="white-space:pre-wrap;">${escapeHtml(report.notes)}</p></div>` : ''}
          <div class="surface card p-6">${platformTable(t('reportForm.metaAds'), d.meta, dPrev?dPrev.meta:null, [["spend","cur"],["impressions","int"],["clicks","int"],["leads","int"],["ctr","pct"],["cpc","cur"],["cpl","cur"]])}</div>
          <div class="surface card p-6">${platformTable(t('reportForm.googleAds'), d.google, dPrev?dPrev.google:null, [["spend","cur"],["impressions","int"],["clicks","int"],["leads","int"],["ctr","pct"],["cpc","cur"],["cpl","cur"]])}</div>
          <div class="surface card p-6">${platformTable(t('reportForm.website'), d.website, dPrev?dPrev.website:null, [["sessions","int"],["users","int"],["conversions","int"],["convRate","pct"]])}</div>
          <div class="surface card p-6">${platformTable(t('reportForm.email'), d.email, dPrev?dPrev.email:null, [["sent","int"],["openRate","pct"],["clickRate","pct"]])}</div>
          ${d.custom.length ? `<div class="surface card p-6">${customTable(d.custom, dPrev?dPrev.custom:null)}</div>` : ""}
        </div>

        <div class="mt-8">
          <div class="eyebrow mb-4">${t('preview.visualizations')}</div>
          <div class="grid gap-4" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));">
            <div class="surface card p-5"><p class="eyebrow mb-3">${t('preview.chartSpend')}</p><canvas id="chartSpend" height="200"></canvas></div>
            <div class="surface card p-5"><p class="eyebrow mb-3">${t('preview.chartLeads')}</p><canvas id="chartLeads" height="200"></canvas></div>
            <div class="surface card p-5"><p class="eyebrow mb-3">${t('preview.chartTrend')}</p><canvas id="chartTrend" height="200"></canvas></div>
          </div>
        </div>
      </div>
    `;

    destroyCharts();
    safeChart(() => {
      const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#6D7178';
      const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#E7EDF3';
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2D7FE0';
      Chart.defaults.color = muted;
      Chart.defaults.borderColor = border;
      Chart.defaults.font.family = "'Inter', sans-serif";
      Chart.defaults.font.size = 11;
      const legendLabelOpts = { color: muted, font:{ size:11, family:"'Inter', sans-serif", weight:'600' }, boxWidth:8, boxHeight:8, padding:16, usePointStyle:true, pointStyle:'circle' };

      chartInstances.push(new Chart(document.getElementById('chartSpend'), {
        type: 'doughnut',
        data: {
          labels: [t('reportForm.metaAds'), t('reportForm.googleAds')],
          datasets: [{ data: [d.meta.spend||0, d.google.spend||0], backgroundColor: [accentColor, border], borderWidth:0 }]
        },
        options: { plugins:{legend:{position:'bottom', labels:legendLabelOpts}}, cutout:'72%' }
      }));

      chartInstances.push(new Chart(document.getElementById('chartLeads'), {
        type: 'bar',
        data: {
          labels: [t('reportForm.metaAds'), t('reportForm.googleAds'), t('reportForm.website')],
          datasets: [{ label:'Volume', data: [d.meta.leads||0, d.google.leads||0, d.website.conversions||0], backgroundColor: accentColor, borderRadius:8, maxBarThickness:40 }]
        },
        options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } } }
      }));

      const clientReports = data.reports.filter(r=>r.clientId===client.id).sort((a,b)=> a.month < b.month ? -1 : 1);
      const trendCtx = document.getElementById('chartTrend').getContext('2d');
      const trendGradient = trendCtx.createLinearGradient(0,0,0,200);
      trendGradient.addColorStop(0, accentColor+'3D');
      trendGradient.addColorStop(1, accentColor+'00');
      chartInstances.push(new Chart(trendCtx, {
        type: 'line',
        data: {
          labels: clientReports.map(r=>monthLabel(r.month)),
          datasets: [{
            label: t('preview.kpiSpend'),
            data: clientReports.map(r=>{ const cd = computeReport(r); return (cd.meta.spend||0)+(cd.google.spend||0); }),
            borderColor: accentColor, backgroundColor: trendGradient,
            fill:true, tension:.4, borderWidth:2.5, pointRadius: clientReports.map(r=> r.id===report.id ? 5 : 3), pointBackgroundColor: accentColor, pointBorderColor: '#fff', pointBorderWidth:2
          }]
        },
        options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } } }
      }));
    });
  }

  function rowMetric(label, type, curr, prevVal){
    const fmt = type==='cur' ? fmtCur : (type==='pct' ? fmtPct : (type==='dec' ? fmtDec : fmtInt));
    return `<tr>
      <td class="py-3 text-sm text-muted">${label}</td>
      <td class="py-3 text-sm font-mono text-right">${fmt(curr)}</td>
      <td class="py-3 text-right">${prevVal===undefined ? '' : deltaBadge(delta(curr, prevVal))}</td>
    </tr>`;
  }
  const PREVIEW_ONLY_KEYS = ['ctr','cpc','cpl','convRate'];
  function metricLabel(key){ return PREVIEW_ONLY_KEYS.includes(key) ? t('preview.'+key) : t('reportForm.'+key); }
  function platformTable(title, curr, prev, defs){
    return `
      <div class="eyebrow mb-4">${title}</div>
      <table>
        <thead><tr class="text-left">
          <th class="py-2 text-xs text-muted font-semibold">${t('preview.indicator')}</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">${t('preview.value')}</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">${t('preview.vsPrevious')}</th>
        </tr></thead>
        <tbody>
          ${defs.map(([key,type]) => rowMetric(metricLabel(key), type, curr[key], prev ? prev[key] : undefined)).join("")}
        </tbody>
      </table>`;
  }
  function customTable(curr, prev){
    return `
      <div class="eyebrow mb-4">${t('preview.customMetrics')}</div>
      <table>
        <thead><tr class="text-left">
          <th class="py-2 text-xs text-muted font-semibold">${t('preview.indicator')}</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">${t('preview.value')}</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">${t('preview.vsPrevious')}</th>
        </tr></thead>
        <tbody>
          ${curr.map(c => {
            const prevItem = prev ? prev.find(p=>p.label===c.label) : null;
            return rowMetric(escapeHtml(c.label), 'dec', c.value, prevItem ? prevItem.value : undefined);
          }).join("")}
        </tbody>
      </table>`;
  }

  /* ---------- CSV export ---------- */
  function exportCsv(reportId){
    const report = data.reports.find(r=>r.id===reportId);
    const client = data.clients.find(c=>c.id===report.clientId);
    const d = computeReport(report);
    const rows = [[t('csvExport.section'), t('csvExport.indicator'), t('csvExport.value')]];
    rows.push([t('csvExport.client'), t('csvExport.name'), client.name]);
    rows.push([t('csvExport.report'), t('csvExport.month'), monthLabel(report.month)]);
    if(report.notes){ rows.push([t('csvExport.report'), t('csvExport.notes'), report.notes]); }
    const push = (section, label, val) => rows.push([section,label, val===null||val===undefined||isNaN(val) ? "" : val]);

    const metaAds = t('reportForm.metaAds'), googleAds = t('reportForm.googleAds'), website = t('reportForm.website'), email = t('reportForm.email');

    push(metaAds, t('reportForm.spend'), d.meta.spend); push(metaAds, t('reportForm.impressions'), d.meta.impressions);
    push(metaAds, t('reportForm.clicks'), d.meta.clicks); push(metaAds, t('reportForm.leads'), d.meta.leads);
    push(metaAds, t('preview.ctr'), d.meta.ctr); push(metaAds, t('preview.cpc'), d.meta.cpc); push(metaAds, t('preview.cpl'), d.meta.cpl);

    push(googleAds, t('reportForm.spend'), d.google.spend); push(googleAds, t('reportForm.impressions'), d.google.impressions);
    push(googleAds, t('reportForm.clicks'), d.google.clicks); push(googleAds, t('reportForm.leads'), d.google.leads);
    push(googleAds, t('preview.ctr'), d.google.ctr); push(googleAds, t('preview.cpc'), d.google.cpc); push(googleAds, t('preview.cpl'), d.google.cpl);

    push(website, t('reportForm.sessions'), d.website.sessions); push(website, t('reportForm.users'), d.website.users);
    push(website, t('reportForm.conversions'), d.website.conversions); push(website, t('preview.convRate'), d.website.convRate);

    push(email, t('reportForm.sent'), d.email.sent); push(email, t('reportForm.openRate'), d.email.openRate); push(email, t('reportForm.clickRate'), d.email.clickRate);

    d.custom.forEach(c => push(t('csvExport.custom'), c.label, c.value));

    const csv = rows.map(row => row.map(cell => {
      const s = String(cell===null||cell===undefined?"":cell);
      return /[",;\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    }).join(";")).join("\r\n");

    const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `rapport_${client.name.replace(/[^a-z0-9]+/gi,'_')}_${report.month}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- Event delegation ---------- */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if(action === "select-client"){ state = {clientId:id, reportId:null, mode:"reports"}; render(); }
    else if(action === "client-tab"){ state.clientTab = el.dataset.tab; render(); }
    else if(action === "new-client"){ state.mode = "new-client"; render(); }
    else if(action === "edit-client"){ state.mode = "edit-client"; render(); }
    else if(action === "load-example"){ loadExample(); }
    else if(action === "clear-example"){ removeExampleData(); }
    else if(action === "go-home"){ state = {clientId:null, reportId:null, mode:"home"}; render(); }
    else if(action === "go-dashboard"){ state = {clientId:null, reportId:null, mode:"welcome"}; render(); }
    else if(action === "go-settings"){ state.mode = "settings"; render(); }
    else if(action === "set-lang"){ setLang(el.dataset.lang); }
    else if(action === "new-report"){ state.reportId = null; state.mode = "form"; render(); }
    else if(action === "open-report"){ state.reportId = id; state.mode = "preview"; render(); }
    else if(action === "edit-report"){ state.reportId = id; state.mode = "form"; render(); }
    else if(action === "delete-report"){
      if(confirm(t('reportsList.confirmDeleteReport'))){
        data.reports = data.reports.filter(r=>r.id!==id);
        saveData();
        render();
      }
    }
    else if(action === "back-to-reports"){ state.mode = "reports"; state.reportId = null; render(); }
    else if(action === "export-csv"){ exportCsv(id); }
  });

  window.addEventListener("resize", () => { fitKpiValues(); });

  /* ---------- Init ---------- */
  document.documentElement.lang = currentLang;
  render();

  // offer example removal via console-accessible hook if example exists and user wants to clear it
  window.__rapport_removeExample = removeExampleData;
})();
</script>
</body>
</html>
