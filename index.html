<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport — Reporting marketing mensuel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-soft:#F7F6F2; --surface:#FFFFFF; --ink:#14151A; --fg:#14151A;
    --muted:#6D7178; --border:#EDEBE6;
    --accent:#5B4FE8; --accent-2:#8B7BFF; --accent-soft:#F0EEFE; --accent-fg:#FFFFFF;
    --success:#129463; --success-soft:#E7F7EF; --danger:#DF4B4B; --danger-soft:#FCEAEA;
    --shadow-sm:0 1px 2px rgba(20,20,35,.05), 0 1px 1px rgba(20,20,35,.03);
    --shadow-md:0 16px 36px -12px rgba(20,20,35,.12), 0 4px 10px -4px rgba(20,20,35,.06);
    --shadow-lg:0 32px 72px -20px rgba(20,20,35,.20);
    --shadow-accent:0 14px 30px -10px rgba(91,79,232,.38);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0A0D; --bg-soft:#131318; --surface:#131318; --ink:#F2F2F6; --fg:#F2F2F6;
      --muted:#9A9AA8; --border:#232329;
      --accent:#8B7FFF; --accent-2:#A89BFF; --accent-soft:#1C1A33; --accent-fg:#0A0A0D;
      --success:#34D399; --success-soft:#0F2A22; --danger:#F87171; --danger-soft:#2A1414;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow-md:0 16px 36px -12px rgba(0,0,0,.5), 0 4px 10px -4px rgba(0,0,0,.4);
      --shadow-lg:0 32px 72px -20px rgba(0,0,0,.6);
      --shadow-accent:0 14px 34px -8px rgba(139,127,255,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0A0D; --bg-soft:#131318; --surface:#131318; --ink:#F2F2F6; --fg:#F2F2F6;
    --muted:#9A9AA8; --border:#232329;
    --accent:#8B7FFF; --accent-2:#A89BFF; --accent-soft:#1C1A33; --accent-fg:#0A0A0D;
    --success:#34D399; --success-soft:#0F2A22; --danger:#F87171; --danger-soft:#2A1414;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 16px 36px -12px rgba(0,0,0,.5), 0 4px 10px -4px rgba(0,0,0,.4);
    --shadow-lg:0 32px 72px -20px rgba(0,0,0,.6);
    --shadow-accent:0 14px 34px -8px rgba(139,127,255,.45);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15.5px; -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .font-display, .headline{ font-family:'Outfit',system-ui,sans-serif; letter-spacing:-.02em; }
  .font-mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:'Inter',sans-serif; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .text-muted{ color:var(--muted); }
  .text-accent{ color:var(--accent); }
  .border-base{ border-color:var(--border); }

  .surface{ background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); }
  .card{ border-radius:20px; }

  .btn{
    display:inline-flex; align-items:center; gap:.5rem; padding:.7rem 1.4rem;
    font-family:'Inter',sans-serif; font-weight:600; font-size:.85rem;
    border-radius:999px; border:1px solid transparent; cursor:pointer; transition:all .18s ease;
  }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:var(--accent-fg); box-shadow:var(--shadow-accent); }
  .btn-primary:hover{ transform:translateY(-1px); filter:brightness(1.04); }
  .btn-ghost{ background:var(--surface); color:var(--ink); border-color:var(--border); box-shadow:var(--shadow-sm); }
  .btn-ghost:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .btn-danger{ background:transparent; color:var(--danger); border-color:transparent; }
  .btn-danger:hover{ background:var(--danger-soft); }
  .btn-sm{ padding:.5rem 1rem; font-size:.78rem; }

  label.field-label{ display:block; font-family:'Inter',sans-serif; font-size:.74rem; font-weight:600; color:var(--muted); margin-bottom:.45rem; }

  input[type=text], input[type=month], input[type=number], input[type=color], textarea, select{
    background:var(--bg-soft); color:var(--ink); border:1px solid transparent;
    border-radius:14px; padding:.65rem .85rem; font-size:.9rem; width:100%; font-family:'Inter',sans-serif;
    transition:border-color .15s, background .15s;
  }
  input:focus, textarea:focus, select:focus{ outline:none; background:var(--surface); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .field-err{ border-color:var(--danger) !important; box-shadow:0 0 0 4px var(--danger-soft) !important; }
  .err-msg{ color:var(--danger); font-size:.78rem; margin-top:.4rem; font-weight:500; }

  .badge{
    font-family:'Inter',sans-serif; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:.25rem .6rem; border:none; color:var(--accent); border-radius:999px; background:var(--accent-soft);
  }
  .badge-example{ color:var(--accent); background:var(--accent-soft); }

  .nav-item{
    margin:0 .75rem; padding:.6rem .9rem; border-radius:12px; color:var(--muted);
    font-size:.9rem; font-weight:500; cursor:pointer; transition:all .15s;
  }
  .nav-item:hover{ background:var(--bg-soft); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }

  .sidebar-item{
    margin:0 .75rem; padding:.55rem .9rem; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; gap:.6rem; transition:background .15s;
  }
  .sidebar-item:hover{ background:var(--bg-soft); }
  .sidebar-item.active{ background:var(--accent-soft); }
  .sidebar-item .cname{ color:var(--fg); }
  .sidebar-item.active .cname{ color:var(--accent); font-weight:600; }

  .scrollbar-thin::-webkit-scrollbar{ width:5px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  .delta{ display:inline-flex; align-items:center; padding:.2rem .55rem; border-radius:999px; font-weight:700; font-size:.72rem; }
  .delta-up{ color:var(--success); background:var(--success-soft); }
  .delta-down{ color:var(--danger); background:var(--danger-soft); }
  .delta-flat{ color:var(--muted); background:var(--bg-soft); }

  table{ border-collapse:collapse; width:100%; }
  tbody tr{ border-bottom:1px solid var(--border); }
  tbody tr:last-child{ border-bottom:none; }
  thead tr{ border-bottom:1px solid var(--border); }

  .kpi-card{ border-radius:20px; padding:1.75rem; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); }
  .kpi-value{ font-family:'Outfit',system-ui,sans-serif; font-weight:700; font-size:3rem; line-height:1; margin:.6rem 0 .8rem; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
  @media (max-width: 860px){
    .kpi-value{ font-size:2.25rem; }
  }

  .hero-glow{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  }
  .hero-glow::before, .hero-glow::after{
    content:""; position:absolute; border-radius:50%; filter:blur(70px); opacity:.35;
  }
  .hero-glow::before{ width:420px; height:420px; background:var(--accent); top:-160px; left:10%; }
  .hero-glow::after{ width:340px; height:340px; background:var(--accent-2); bottom:-140px; right:12%; opacity:.25; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; color:#111; }
  }
  @media (max-width: 860px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100% !important; max-height:none; position:static !important; border-right:none !important; border-bottom:1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="app-shell flex min-h-screen">
  <aside class="sidebar no-print flex flex-col" style="width:232px; flex-shrink:0; background:var(--bg); border-right:1px solid var(--border); position:sticky; top:0; height:100vh;">
    <div class="px-5 pt-7 pb-6">
      <div class="flex items-center gap-2.5">
        <span style="width:1.6rem; height:1.6rem; border-radius:8px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink:0; box-shadow:var(--shadow-accent);"></span>
        <h1 class="headline font-bold" style="font-size:1.35rem; line-height:1;">Rapport</h1>
      </div>
      <p class="text-muted text-xs mt-2">Reporting marketing</p>
    </div>

    <nav class="flex flex-col gap-1">
      <div class="nav-item" id="navDashboard" data-action="go-dashboard">Tableau de bord</div>
    </nav>

    <div class="px-5 pt-7 pb-2">
      <span class="eyebrow">Clients</span>
    </div>
    <div id="clientList" class="flex flex-col gap-0.5 overflow-y-auto scrollbar-thin" style="max-height:calc(100vh - 380px);"></div>

    <div class="px-4 pt-5 flex flex-col gap-2">
      <button class="btn btn-primary w-full justify-center btn-sm" data-action="new-client">+ Nouveau client</button>
      <button class="btn btn-ghost w-full justify-center btn-sm" data-action="load-example">Charger client exemple</button>
    </div>

    <nav class="pt-5 pb-7 mt-auto flex flex-col gap-1" style="border-top:1px solid var(--border); margin-top:auto; padding-top:1.25rem;">
      <div class="nav-item" id="navSettings" data-action="go-settings">Paramètres</div>
    </nav>
  </aside>

  <main id="main" class="flex-1 overflow-y-auto" style="padding:4rem 4.5rem; position:relative;"></main>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Storage ---------- */
  const STORAGE_KEY = "rapport_data_v1";
  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {clients:[], reports:[]};
      const parsed = JSON.parse(raw);
      return {clients: parsed.clients||[], reports: parsed.reports||[]};
    }catch(e){ return {clients:[], reports:[]}; }
  }
  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ console.error("Échec de la sauvegarde locale", e); }
  }

  let data = loadData();
  let state = { clientId: null, reportId: null, mode: "welcome" }; // mode: welcome|reports|form|preview|new-client|edit-client|settings

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  /* ---------- Utils: numbers & formatting ---------- */
  function toNum(v){
    if(v === "" || v === null || v === undefined) return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function isValidMetric(v, allowEmpty){
    if(v === "" || v === null || v === undefined) return allowEmpty;
    const n = Number(v);
    return Number.isFinite(n) && n >= 0;
  }
  function fmtInt(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : Math.round(v).toLocaleString('fr-FR'); }
  function fmtDec(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function fmtCur(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }
  function fmtPct(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}) + " %"; }
  function safeDiv(n, d){
    if(n===null||n===undefined||d===null||d===undefined||!Number.isFinite(n)||!Number.isFinite(d)||d===0) return null;
    return n/d;
  }
  function safePct(n, d){ const r = safeDiv(n,d); return r===null ? null : r*100; }
  function monthLabel(m){
    if(!m) return "—";
    const [y,mo] = m.split("-");
    const names = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
    const idx = parseInt(mo,10)-1;
    return (names[idx]||mo) + " " + y;
  }
  function nextMonthStr(m){
    const [y,mo] = m.split("-").map(Number);
    const d = new Date(y, mo, 1);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function currentMonthStr(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }

  /* ---------- Derived metrics ---------- */
  function computePlatform(p){
    const spend = toNum(p.spend), impressions = toNum(p.impressions), clicks = toNum(p.clicks), leads = toNum(p.leads);
    return {
      spend, impressions, clicks, leads,
      ctr: safePct(clicks, impressions),
      cpc: safeDiv(spend, clicks),
      cpl: safeDiv(spend, leads)
    };
  }
  function computeWebsite(w){
    const sessions = toNum(w.sessions), users = toNum(w.users), conversions = toNum(w.conversions);
    return { sessions, users, conversions, convRate: safePct(conversions, sessions) };
  }
  function computeEmail(e){
    return { sent: toNum(e.sent), openRate: toNum(e.openRate), clickRate: toNum(e.clickRate) };
  }
  function computeReport(r){
    return {
      meta: computePlatform(r.meta||{}),
      google: computePlatform(r.google||{}),
      website: computeWebsite(r.website||{}),
      email: computeEmail(r.email||{}),
      custom: (r.custom||[]).map(c=>({label:c.label, value: toNum(c.value)}))
    };
  }
  function getPreviousReport(report){
    const siblings = data.reports
      .filter(r => r.clientId === report.clientId && r.month < report.month)
      .sort((a,b) => a.month < b.month ? 1 : -1);
    return siblings[0] || null;
  }
  function delta(curr, prev){
    if(curr===null||prev===null||prev===0) return null;
    return ((curr-prev)/prev)*100;
  }
  function deltaBadge(d){
    if(d===null||isNaN(d)) return '<span class="text-muted text-xs">—</span>';
    const cls = d>0.001 ? "delta-up" : (d<-0.001 ? "delta-down" : "delta-flat");
    const arrow = d>0.001 ? "▲" : (d<-0.001 ? "▼" : "▬");
    return `<span class="delta ${cls} font-mono">${arrow} ${Math.abs(d).toLocaleString('fr-FR',{maximumFractionDigits:1})}%</span>`;
  }

  /* ---------- Example data ---------- */
  function exampleClient(){
    return { id: uid("client"), name: "Client Exemple (Démo)", logo: "", color: "#5B4FE8", isExample: true };
  }
  function exampleReports(clientId){
    const months = ["2026-05","2026-06","2026-07"];
    const base = [
      { meta:{spend:1200,impressions:85000,clicks:1700,leads:42}, google:{spend:950,impressions:40000,clicks:1100,leads:30},
        website:{sessions:9000,users:7200,conversions:220}, email:{sent:5000,openRate:28.4,clickRate:4.1}, custom:[{label:"Abonnés Instagram",value:3200}] },
      { meta:{spend:1350,impressions:91000,clicks:1950,leads:51}, google:{spend:980,impressions:42000,clicks:1180,leads:33},
        website:{sessions:9800,users:7700,conversions:255}, email:{sent:5100,openRate:30.1,clickRate:4.6}, custom:[{label:"Abonnés Instagram",value:3350}] },
      { meta:{spend:1280,impressions:88000,clicks:1860,leads:47}, google:{spend:1020,impressions:44500,clicks:1250,leads:35},
        website:{sessions:10100,users:8000,conversions:268}, email:{sent:5250,openRate:29.5,clickRate:4.3}, custom:[{label:"Abonnés Instagram",value:3480}] }
    ];
    return months.map((m,i)=>({ id: uid("report"), clientId, month: m, isExample:true, ...base[i] }));
  }
  function loadExample(){
    if(data.clients.some(c=>c.isExample)){
      alert("Le client exemple est déjà chargé.");
      return;
    }
    const c = exampleClient();
    data.clients.push(c);
    exampleReports(c.id).forEach(r=>data.reports.push(r));
    saveData();
    state = { clientId: c.id, reportId: null, mode: "reports" };
    render();
  }
  function removeExampleData(){
    if(!confirm("Supprimer le client exemple et ses rapports ?")) return;
    const exClients = data.clients.filter(c=>c.isExample).map(c=>c.id);
    data.clients = data.clients.filter(c=>!c.isExample);
    data.reports = data.reports.filter(r=>!exClients.includes(r.clientId));
    saveData();
    if(exClients.includes(state.clientId)){ state = {clientId:null, reportId:null, mode:"welcome"}; }
    render();
  }

  /* ---------- Rendering: sidebar ---------- */
  function renderSidebar(){
    const list = document.getElementById("clientList");
    if(data.clients.length === 0){
      list.innerHTML = `<p class="text-muted text-xs py-2 px-5">Aucun client pour l'instant.</p>`;
    }else{
      list.innerHTML = data.clients.map(c => `
        <div class="sidebar-item ${c.id===state.clientId?'active':''}" data-action="select-client" data-id="${c.id}">
          ${c.logo ? `<img src="${escapeAttr(c.logo)}" class="w-5 h-5 rounded-full object-cover flex-shrink-0" onerror="this.style.display='none'">` : `<span class="w-5 h-5 rounded-full inline-block flex-shrink-0" style="background:${escapeAttr(c.color||'#5B4FE8')}"></span>`}
          <span class="cname text-sm flex-1 truncate">${escapeHtml(c.name)}</span>
          ${c.isExample ? '<span class="badge badge-example">EX</span>' : ''}
        </div>
      `).join("");
    }
    const navDash = document.getElementById("navDashboard");
    const navSet = document.getElementById("navSettings");
    if(navDash) navDash.classList.toggle("active", state.mode === "welcome" || state.mode === "new-client");
    if(navSet) navSet.classList.toggle("active", state.mode === "settings");
  }

  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------- Rendering: main router ---------- */
  function render(){
    renderSidebar();
    const main = document.getElementById("main");
    if(state.mode === "new-client") return renderClientForm(main, null);
    if(state.mode === "settings") return renderSettings(main);
    if(state.mode === "welcome" || !state.clientId) return renderWelcome(main);
    const client = data.clients.find(c=>c.id===state.clientId);
    if(!client){ state = {clientId:null, reportId:null, mode:"welcome"}; return renderWelcome(main); }
    if(state.mode === "reports") return renderReportsList(main, client);
    if(state.mode === "form") return renderReportForm(main, client, state.reportId);
    if(state.mode === "preview") return renderReportPreview(main, client, state.reportId);
    if(state.mode === "edit-client") return renderClientForm(main, client);
    renderReportsList(main, client);
  }

  function renderWelcome(main){
    if(data.clients.length === 0) return renderLanding(main);
    renderDashboardOverview(main);
  }

  /* ---------- Landing (first-run explainer) ---------- */
  function renderLanding(main){
    main.innerHTML = `
      <div class="hero-glow"></div>
      <div style="position:relative; z-index:1; max-width:760px; margin:0 auto;">
        <div class="text-center" style="max-width:560px; margin:0 auto;">
          <span style="width:3.5rem; height:3.5rem; border-radius:16px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); display:inline-flex; align-items:center; justify-content:center; margin-bottom:2rem; box-shadow:var(--shadow-accent);"></span>
          <h2 class="headline font-bold mb-4" style="font-size:2.75rem; line-height:1.08;">Des rapports marketing clairs, en quelques minutes.</h2>
          <p class="text-muted mb-10" style="font-size:1.05rem;">Rapport est un outil de reporting mensuel pensé pour les freelances et petites agences. Collez vos chiffres, obtenez des métriques calculées automatiquement et un rapport prêt à partager — sans serveur, sans compte, sans IA. Tout reste dans votre navigateur.</p>
          <div class="flex gap-3 justify-center">
            <button class="btn btn-primary" data-action="new-client">+ Nouveau client</button>
            <button class="btn btn-ghost" data-action="load-example">Voir un exemple</button>
          </div>
        </div>

        <div class="eyebrow text-center mt-16 mb-6">Comment ça marche</div>
        <div class="grid gap-4" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">
          <div class="surface card p-6">
            <span class="eyebrow" style="color:var(--accent);">01</span>
            <p class="font-semibold mt-2 mb-1">Ajoutez un client</p>
            <p class="text-muted text-sm">Nom, logo et couleur de marque pour des rapports à son image.</p>
          </div>
          <div class="surface card p-6">
            <span class="eyebrow" style="color:var(--accent);">02</span>
            <p class="font-semibold mt-2 mb-1">Collez vos chiffres</p>
            <p class="text-muted text-sm">Meta, Google, site web, email — un formulaire par mois, en quelques minutes.</p>
          </div>
          <div class="surface card p-6">
            <span class="eyebrow" style="color:var(--accent);">03</span>
            <p class="font-semibold mt-2 mb-1">Partagez le rapport</p>
            <p class="text-muted text-sm">Métriques calculées automatiquement, graphiques, export CSV et PDF.</p>
          </div>
        </div>
      </div>`;
  }

  /* ---------- Dashboard overview (returning users) ---------- */
  function latestReportFor(clientId){
    return data.reports.filter(r=>r.clientId===clientId).sort((a,b)=> a.month < b.month ? 1 : -1)[0] || null;
  }
  function renderDashboardOverview(main){
    const cm = currentMonthStr();
    const totalSpendLatest = data.clients.reduce((sum,c)=>{
      const latest = latestReportFor(c.id);
      if(!latest) return sum;

  function renderReportForm(main, client, reportId){
    const existing = reportId ? data.reports.find(r=>r.id===reportId) : null;
    const r = existing ? JSON.parse(JSON.stringify(existing)) : emptyReport(client.id);
    const customRows = r.custom && r.custom.length ? r.custom : [];
    const latestPrior = !existing ? data.reports.filter(rep=>rep.clientId===client.id).sort((a,b)=> a.month < b.month ? 1 : -1)[0] : null;

    main.innerHTML = `
      <div class="flex items-center justify-between mb-8 flex-wrap gap-2">
        <h2 class="headline font-bold" style="font-size:2rem;">${existing ? "Modifier le rapport" : "Nouveau rapport"} — ${escapeHtml(client.name)}</h2>
        <div class="flex gap-2">
          ${latestPrior ? `<button type="button" class="btn btn-ghost btn-sm" id="duplicateLastMonth">Dupliquer le mois dernier</button>` : ''}
          <button class="btn btn-ghost btn-sm" data-action="back-to-reports">← Retour</button>
        </div>
      </div>
      <form id="reportForm" class="flex flex-col gap-5" style="max-width:720px;">
        <div class="surface card p-6">
          <label class="field-label">Mois du rapport *</label>
          <input type="month" name="month" required value="${r.month||''}" style="max-width:220px;">
          <div class="err-msg hidden" data-err="month"></div>
        </div>

        ${platformFieldsHtml("meta","Meta Ads", r.meta, [["spend","Dépense (€)"],["impressions","Impressions"],["clicks","Clics"],["leads","Leads"]])}
        ${platformFieldsHtml("google","Google Ads", r.google, [["spend","Dépense (€)"],["impressions","Impressions"],["clicks","Clics"],["leads","Leads"]])}
        ${platformFieldsHtml("website","Site web", r.website, [["sessions","Sessions"],["users","Utilisateurs"],["conversions","Conversions"]])}
        ${platformFieldsHtml("email","Email", r.email, [["sent","Emails envoyés"],["openRate","Taux d'ouverture (%)"],["clickRate","Taux de clic (%)"]])}

        <fieldset class="surface card p-6">
          <legend class="eyebrow px-1">Métriques personnalisées</legend>
          <div id="customRows" class="flex flex-col gap-2 mt-3"></div>
          <button type="button" class="btn btn-ghost btn-sm mt-3" id="addCustomRow">+ Ajouter une métrique</button>
        </fieldset>

        <div class="flex gap-2">
          <button type="submit" class="btn btn-primary">Enregistrer le rapport</button>
          <button type="button" class="btn btn-ghost" id="cancelReport">Annuler</button>
        </div>
      </form>
    `;

    const customContainer = document.getElementById("customRows");
    function addCustomRow(label="", value=""){
      const row = document.createElement("div");
      row.className = "flex gap-2 items-start custom-row";
      row.innerHTML = `
        <input type="text" class="custom-label" placeholder="Nom de la métrique" value="${escapeAttr(label)}" style="flex:2;">
        <input type="number" step="any" class="custom-value" placeholder="Valeur" value="${value}" style="flex:1;">
        <button type="button" class="btn btn-danger btn-sm remove-row">✕</button>
      `;
      row.querySelector(".remove-row").onclick = () => row.remove();
      customContainer.appendChild(row);
    }
    customRows.forEach(c => addCustomRow(c.label, c.value===null||c.value===undefined?"":c.value));
    document.getElementById("addCustomRow").onclick = () => addCustomRow();

    const dupBtn = document.getElementById("duplicateLastMonth");
    if(dupBtn){
      dupBtn.onclick = () => {
        const form = document.getElementById("reportForm");
        const monthField = form.querySelector('[name="month"]');
        if(!monthField.value) monthField.value = nextMonthStr(latestPrior.month);
        ["meta","google","website","email"].forEach(section=>{
          Object.keys(latestPrior[section]||{}).forEach(key=>{
            const input = form.querySelector(`[name="${section}.${key}"]`);
            if(input) input.value = latestPrior[section][key] ?? "";
          });
        });
        customContainer.innerHTML = "";
        (latestPrior.custom||[]).forEach(c => addCustomRow(c.label, c.value===null||c.value===undefined?"":c.value));
      };
    }

    document.getElementById("cancelReport").onclick = () => { state.mode = "reports"; render(); };

    document.getElementById("reportForm").onsubmit = (e) => {
      e.preventDefault();
      const form = e.target;
      let hasError = false;
      form.querySelectorAll(".err-msg").forEach(el=>el.classList.add("hidden"));
      form.querySelectorAll("input").forEach(el=>el.classList.remove("field-err"));

      const monthInput = form.querySelector('[name="month"]');
      if(!monthInput.value){
        showErr(form, "month", "Le mois est obligatoire.");
        monthInput.classList.add("field-err");
        hasError = true;
      }

      const metricFields = form.querySelectorAll('[data-metric]');
      metricFields.forEach(input => {
        const v = input.value;
        if(!isValidMetric(v, true)){
          showErr(form, input.dataset.metric, "Doit être un nombre positif.");
          input.classList.add("field-err");
          hasError = true;
        }
      });

      // email rates should not exceed 100
      ["email.openRate","email.clickRate"].forEach(key=>{
        const input = form.querySelector(`[data-metric="${key}"]`);
        if(input && input.value !== "" && Number(input.value) > 100){
          showErr(form, key, "Doit être compris entre 0 et 100.");
          input.classList.add("field-err");
          hasError = true;
        }
      });

      if(hasError) return;

      const fd = new FormData(form);
      function g(name){ const v = fd.get(name); return v===null||v==="" ? "" : v; }

      const newReport = {
        id: r.id, clientId: client.id, month: fd.get("month"), isExample: existing ? existing.isExample : false,
        meta: { spend:g("meta.spend"), impressions:g("meta.impressions"), clicks:g("meta.clicks"), leads:g("meta.leads") },
        google: { spend:g("google.spend"), impressions:g("google.impressions"), clicks:g("google.clicks"), leads:g("google.leads") },
        website: { sessions:g("website.sessions"), users:g("website.users"), conversions:g("website.conversions") },
        email: { sent:g("email.sent"), openRate:g("email.openRate"), clickRate:g("email.clickRate") },
        custom: Array.from(customContainer.querySelectorAll(".custom-row")).map(row => ({
          label: row.querySelector(".custom-label").value.trim(),
          value: row.querySelector(".custom-value").value
        })).filter(c => c.label !== "")
      };

      // prevent duplicate month for same client (except when editing same report)
      const dup = data.reports.find(rep => rep.clientId===client.id && rep.month===newReport.month && rep.id!==newReport.id);
      if(dup){
        showErr(form, "month", "Un rapport existe déjà pour ce mois.");
        monthInput.classList.add("field-err");
        return;
      }

      if(existing){
        const idx = data.reports.findIndex(rep=>rep.id===existing.id);
        data.reports[idx] = newReport;
      }else{
        data.reports.push(newReport);
      }
      saveData();
      state.reportId = newReport.id;
      state.mode = "preview";
      render();
    };

    function showErr(form, key, msg){
      const el = form.querySelector(`[data-err="${key}"]`);
      if(el){ el.textContent = msg; el.classList.remove("hidden"); }
    }
  }

        </div>

        <div class="mt-8">
          <div class="eyebrow mb-4">Visualisations</div>
          <div class="grid gap-4" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));">
            <div class="surface card p-5"><p class="eyebrow mb-3">Répartition des dépenses</p><canvas id="chartSpend" height="200"></canvas></div>
            <div class="surface card p-5"><p class="eyebrow mb-3">Leads &amp; conversions</p><canvas id="chartLeads" height="200"></canvas></div>
            <div class="surface card p-5"><p class="eyebrow mb-3">Évolution du budget</p><canvas id="chartTrend" height="200"></canvas></div>
          </div>
        </div>
      </div>
    `;

    destroyCharts();
    const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#6D7178';
    const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#EDEBE6';
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5B4FE8';
    const accentColor2 = getComputedStyle(document.documentElement).getPropertyValue('--accent-2').trim() || '#8B7BFF';
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = border;
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.font.size = 11;
    const legendLabelOpts = { color: muted, font:{ size:11, family:"'Inter', sans-serif", weight:'600' }, boxWidth:8, boxHeight:8, padding:16, usePointStyle:true, pointStyle:'circle' };

    chartInstances.push(new Chart(document.getElementById('chartSpend'), {
      type: 'doughnut',
      data: {
        labels: ['Meta Ads','Google Ads'],
        datasets: [{ data: [d.meta.spend||0, d.google.spend||0], backgroundColor: [accentColor, border], borderWidth:0 }]
      },
      options: { plugins:{legend:{position:'bottom', labels:legendLabelOpts}}, cutout:'72%' }
    }));

    chartInstances.push(new Chart(document.getElementById('chartLeads'), {
      type: 'bar',
      data: {
        labels: ['Meta Ads','Google Ads','Site web'],
        datasets: [{ label:'Volume', data: [d.meta.leads||0, d.google.leads||0, d.website.conversions||0], backgroundColor: accentColor, borderRadius:8, maxBarThickness:40 }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } } }
    }));

    const clientReports = data.reports.filter(r=>r.clientId===client.id).sort((a,b)=> a.month < b.month ? -1 : 1);
    const trendCtx = document.getElementById('chartTrend').getContext('2d');
    const trendGradient = trendCtx.createLinearGradient(0,0,0,200);
    trendGradient.addColorStop(0, accentColor+'3D');
    trendGradient.addColorStop(1, accentColor+'00');
    chartInstances.push(new Chart(trendCtx, {
      type: 'line',
      data: {
        labels: clientReports.map(r=>monthLabel(r.month)),
        datasets: [{
          label:'Dépense totale (€)',
          data: clientReports.map(r=>{ const cd = computeReport(r); return (cd.meta.spend||0)+(cd.google.spend||0); }),
          borderColor: accentColor, backgroundColor: trendGradient,
          fill:true, tension:.4, borderWidth:2.5, pointRadius: clientReports.map(r=> r.id===report.id ? 5 : 3), pointBackgroundColor: accentColor, pointBorderColor: '#fff', pointBorderWidth:2
        }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } } }
    }));
  }

  function rowMetric(label, type, curr, prevVal){
    const fmt = type==='cur' ? fmtCur : (type==='pct' ? fmtPct : (type==='dec' ? fmtDec : fmtInt));
    return `<tr>
      <td class="py-3 text-sm text-muted">${label}</td>
      <td class="py-3 text-sm font-mono text-right">${fmt(curr)}</td>
      <td class="py-3 text-right">${prevVal===undefined ? '' : deltaBadge(delta(curr, prevVal))}</td>
    </tr>`;
  }
  function platformTable(title, curr, prev, defs){
    return `
      <div class="eyebrow mb-4">${title}</div>
      <table>
        <thead><tr class="text-left">
          <th class="py-2 text-xs text-muted font-semibold">Indicateur</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">Valeur</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">vs mois précédent</th>
        </tr></thead>
        <tbody>
          ${defs.map(([key,label,type]) => rowMetric(label, type, curr[key], prev ? prev[key] : undefined)).join("")}
        </tbody>
      </table>`;
  }
  function customTable(curr, prev){
    return `
      <div class="eyebrow mb-4">Métriques personnalisées</div>
      <table>
        <thead><tr class="text-left">
          <th class="py-2 text-xs text-muted font-semibold">Indicateur</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">Valeur</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">vs mois précédent</th>
        </tr></thead>
        <tbody>
          ${curr.map(c => {
            const prevItem = prev ? prev.find(p=>p.label===c.label) : null;
            return rowMetric(escapeHtml(c.label), 'dec', c.value, prevItem ? prevItem.value : undefined);
          }).join("")}
        </tbody>
      </table>`;
  }

  /* ---------- CSV export ---------- */
  function exportCsv(reportId){
    const report = data.reports.find(r=>r.id===reportId);
    const client = data.clients.find(c=>c.id===report.clientId);
    const d = computeReport(report);
    const rows = [["Section","Indicateur","Valeur"]];
    rows.push(["Client","Nom",client.name]);
    rows.push(["Rapport","Mois",monthLabel(report.month)]);
    const push = (section, label, val) => rows.push([section,label, val===null||val===undefined||isNaN(val) ? "" : val]);

    push("Meta Ads","Dépense (€)", d.meta.spend); push("Meta Ads","Impressions", d.meta.impressions);
    push("Meta Ads","Clics", d.meta.clicks); push("Meta Ads","Leads", d.meta.leads);
    push("Meta Ads","CTR (%)", d.meta.ctr); push("Meta Ads","CPC (€)", d.meta.cpc); push("Meta Ads","CPL (€)", d.meta.cpl);

    push("Google Ads","Dépense (€)", d.google.spend); push("Google Ads","Impressions", d.google.impressions);
    push("Google Ads","Clics", d.google.clicks); push("Google Ads","Leads", d.google.leads);
    push("Google Ads","CTR (%)", d.google.ctr); push("Google Ads","CPC (€)", d.google.cpc); push("Google Ads","CPL (€)", d.google.cpl);

    push("Site web","Sessions", d.website.sessions); push("Site web","Utilisateurs", d.website.users);
    push("Site web","Conversions", d.website.conversions); push("Site web","Taux de conversion (%)", d.website.convRate);

    push("Email","Envoyés", d.email.sent); push("Email","Taux d'ouverture (%)", d.email.openRate); push("Email","Taux de clic (%)", d.email.clickRate);

    d.custom.forEach(c => push("Personnalisé", c.label, c.value));

    const csv = rows.map(row => row.map(cell => {
      const s = String(cell===null||cell===undefined?"":cell);
      return /[",;\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    }).join(";")).join("\r\n");

    const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `rapport_${client.name.replace(/[^a-z0-9]+/gi,'_')}_${report.month}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- Event delegation ---------- */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if(action === "select-client"){ state = {clientId:id, reportId:null, mode:"reports"}; render(); }
    else if(action === "new-client"){ state.mode = "new-client"; render(); }
    else if(action === "edit-client"){ state.mode = "edit-client"; render(); }
    else if(action === "load-example"){ loadExample(); }
    else if(action === "clear-example"){ removeExampleData(); }
    else if(action === "go-dashboard"){ state = {clientId:null, reportId:null, mode:"welcome"}; render(); }
    else if(action === "go-settings"){ state.mode = "settings"; render(); }
    else if(action === "new-report"){ state.reportId = null; state.mode = "form"; render(); }
    else if(action === "open-report"){ state.reportId = id; state.mode = "preview"; render(); }
    else if(action === "edit-report"){ state.reportId = id; state.mode = "form"; render(); }
    else if(action === "delete-report"){
      if(confirm("Supprimer ce rapport ?")){
        data.reports = data.reports.filter(r=>r.id!==id);
        saveData();
        render();
      }
    }
    else if(action === "back-to-reports"){ state.mode = "reports"; state.reportId = null; render(); }
    else if(action === "export-csv"){ exportCsv(id); }
  });

  /* ---------- Init ---------- */
  render();

  // offer example removal via console-accessible hook if example exists and user wants to clear it
  window.__rapport_removeExample = removeExampleData;
})();
</script>
</body>
