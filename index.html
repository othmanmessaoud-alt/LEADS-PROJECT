<style>
  :root{
    --bg:#FFFFFF; --bg-soft:#F4F8FC; --surface:#FFFFFF; --ink:#14151A; --fg:#14151A;
    --muted:#6D7178; --border:#E7EDF3;
    --accent:#2D7FE0; --accent-2:#5FA8F0; --accent-soft:#EAF3FD; --accent-fg:#FFFFFF;
    --success:#129463; --success-soft:#E7F7EF; --danger:#DF4B4B; --danger-soft:#FCEAEA;
    --shadow-sm:0 1px 2px rgba(20,20,35,.05), 0 1px 1px rgba(20,20,35,.03);
    --shadow-md:0 16px 36px -12px rgba(20,20,35,.12), 0 4px 10px -4px rgba(20,20,35,.06);
    --shadow-lg:0 32px 72px -20px rgba(20,20,35,.20);
    --shadow-accent:0 14px 30px -10px rgba(45,127,224,.35);
    color-scheme: light;
  }
  /* Dark mode is opt-in only (data-theme="dark"); the app always renders light by default
     regardless of OS/browser preference, since this is a reporting tool meant to read as
     bright and clear rather than follow system dark mode. */
  :root[data-theme="dark"]{
    --bg:#0A0A0D; --bg-soft:#131318; --surface:#131318; --ink:#F2F2F6; --fg:#F2F2F6;
    --muted:#9A9AA8; --border:#232329;
    --accent:#5FA8F0; --accent-2:#8CC3F7; --accent-soft:#132A3D; --accent-fg:#0A0A0D;
    --success:#34D399; --success-soft:#0F2A22; --danger:#F87171; --danger-soft:#2A1414;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 16px 36px -12px rgba(0,0,0,.5), 0 4px 10px -4px rgba(0,0,0,.4);
    --shadow-lg:0 32px 72px -20px rgba(0,0,0,.6);
    --shadow-accent:0 14px 34px -8px rgba(95,168,240,.4);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15.5px; -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  .font-display, .headline{ font-family:'Outfit',system-ui,sans-serif; letter-spacing:-.02em; }
  .font-mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:'Inter',sans-serif; font-size:.72rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .text-muted{ color:var(--muted); }
  .text-accent{ color:var(--accent); }
  .border-base{ border-color:var(--border); }

  .surface{ background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); }
  .card{ border-radius:20px; }

  .btn{
    display:inline-flex; align-items:center; gap:.5rem; padding:.7rem 1.4rem;
    font-family:'Inter',sans-serif; font-weight:600; font-size:.85rem;
    border-radius:999px; border:1px solid transparent; cursor:pointer; transition:all .18s ease;
    white-space:nowrap;
  }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:var(--accent-fg); box-shadow:var(--shadow-accent); }
  .btn-primary:hover{ transform:translateY(-1px); filter:brightness(1.04); }
  .btn-ghost{ background:var(--surface); color:var(--ink); border-color:var(--border); box-shadow:var(--shadow-sm); }
  .btn-ghost:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .btn-danger{ background:transparent; color:var(--danger); border-color:transparent; }
  .btn-danger:hover{ background:var(--danger-soft); }
  .btn-sm{ padding:.5rem 1rem; font-size:.78rem; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none !important; }

  .lang-btn{
    font-family:'Inter',sans-serif; font-size:.72rem; font-weight:700; padding:.3rem .55rem; border-radius:8px;
    color:var(--muted); cursor:pointer; border:1px solid transparent; transition:all .15s;
  }
  .lang-btn:hover{ background:var(--bg-soft); color:var(--ink); }
  .lang-btn.active{ background:var(--accent-soft); color:var(--accent); }

  label.field-label{ display:block; font-family:'Inter',sans-serif; font-size:.74rem; font-weight:600; color:var(--muted); margin-bottom:.45rem; }

  input[type=text], input[type=month], input[type=number], input[type=color], textarea, select{
    background:var(--bg-soft); color:var(--ink); border:1px solid transparent;
    border-radius:14px; padding:.65rem .85rem; font-size:.9rem; width:100%; font-family:'Inter',sans-serif;
    transition:border-color .15s, background .15s;
  }
  select{ cursor:pointer; }
  input:focus, select:focus, textarea:focus{ outline:none; background:var(--surface); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .field-err{ border-color:var(--danger) !important; box-shadow:0 0 0 4px var(--danger-soft) !important; }
  .err-msg{ color:var(--danger); font-size:.78rem; margin-top:.4rem; font-weight:500; }

  .badge{
    font-family:'Inter',sans-serif; font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:.25rem .6rem; border:none; color:var(--accent); border-radius:999px; background:var(--accent-soft);
    white-space:nowrap;
  }
  .badge-example{ color:var(--accent); background:var(--accent-soft); }

  .nav-item{
    margin:0 .75rem; padding:.6rem .9rem; border-radius:12px; color:var(--muted);
    font-size:.9rem; font-weight:500; cursor:pointer; transition:all .15s;
  }
  .nav-item:hover{ background:var(--bg-soft); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }

  .sidebar-item{
    margin:0 .75rem; padding:.55rem .9rem; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; gap:.6rem; transition:background .15s;
  }
  .sidebar-item:hover{ background:var(--bg-soft); }
  .sidebar-item.active{ background:var(--accent-soft); }
  .sidebar-item .cname{ color:var(--fg); }
  .sidebar-item.active .cname{ color:var(--accent); font-weight:600; }

  .scrollbar-thin::-webkit-scrollbar{ width:5px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  .delta{ display:inline-flex; align-items:center; padding:.2rem .55rem; border-radius:999px; font-weight:700; font-size:.72rem; white-space:nowrap; }
  .delta-up{ color:var(--success); background:var(--success-soft); }
  .delta-down{ color:var(--danger); background:var(--danger-soft); }
  .delta-flat{ color:var(--muted); background:var(--bg-soft); }

  table{ border-collapse:collapse; width:100%; }
  tbody tr{ border-bottom:1px solid var(--border); }
  tbody tr:last-child{ border-bottom:none; }
  thead tr{ border-bottom:1px solid var(--border); }

  /* KPI tiles: min-width:0 lets the value shrink instead of overflowing its card,
     and fitKpiValues() (JS) auto-shrinks font-size further for very large numbers
     so nothing ever clips or wraps mid-digit. */
  .kpi-card{ border-radius:20px; padding:1.75rem; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); min-width:0; overflow:hidden; }
  .kpi-value{
    font-family:'Outfit',system-ui,sans-serif; font-weight:700; font-size:2.75rem; line-height:1.1;
    margin:.6rem 0 .8rem; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
    white-space:nowrap; overflow:hidden; display:block; max-width:100%;
  }
  @media (max-width: 860px){
    .kpi-value{ font-size:2.1rem; }
  }

  .hero-glow{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  }
  .hero-glow::before, .hero-glow::after{
    content:""; position:absolute; border-radius:50%; filter:blur(70px); opacity:.35;
  }
  .hero-glow::before{ width:420px; height:420px; background:var(--accent); top:-160px; left:10%; }
  .hero-glow::after{ width:340px; height:340px; background:var(--accent-2); bottom:-140px; right:12%; opacity:.25; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,20,30,.45); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:1.5rem;
  }
  .modal-panel{
    background:var(--surface); border-radius:20px; box-shadow:var(--shadow-lg); border:1px solid var(--border);
    max-width:560px; width:100%; max-height:85vh; overflow-y:auto; padding:2rem;
  }
  .map-row{ display:grid; grid-template-columns:1fr 1.3fr; gap:1rem; align-items:center; padding:.5rem 0; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; color:#111; }
  }
  @media (max-width: 860px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100% !important; max-height:none; position:static !important; border-right:none !important; border-bottom:1px solid var(--border); }
    .map-row{ grid-template-columns:1fr; }
  }
</style>
</head>

    <div class="px-5 pt-7 pb-6">
      <div class="flex items-center gap-2.5">
        <span style="width:1.6rem; height:1.6rem; border-radius:8px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink:0; box-shadow:var(--shadow-accent);"></span>
        <h1 class="headline font-bold" style="font-size:1.35rem; line-height:1;" id="appNameLabel">Rapport</h1>
      </div>
      <p class="text-muted text-xs mt-2" id="taglineLabel">Reporting marketing</p>
    </div>

    <nav class="flex flex-col gap-1">
      <div class="nav-item" id="navDashboard" data-action="go-dashboard">Tableau de bord</div>
    </nav>

    <div class="px-5 pt-7 pb-2">
      <span class="eyebrow" id="clientsLabel">Clients</span>
    </div>
    <div id="clientList" class="flex flex-col gap-0.5 overflow-y-auto scrollbar-thin" style="max-height:calc(100vh - 430px);"></div>

    <div class="px-4 pt-5 flex flex-col gap-2">
      <button class="btn btn-primary w-full justify-center btn-sm" data-action="new-client" id="newClientBtn">+ Nouveau client</button>
      <button class="btn btn-ghost w-full justify-center btn-sm" data-action="load-example" id="loadExampleBtn">Charger client exemple</button>
    </div>

    <div class="px-5 pt-5 flex items-center gap-1" id="langSwitchSidebar"></div>

    <nav class="pt-3 pb-7 flex flex-col gap-1" style="border-top:1px solid var(--border); margin-top:.75rem; padding-top:1rem;">
      <div class="nav-item" id="navSettings" data-action="go-settings">Paramètres</div>
    </nav>
  </aside>

  <main id="main" class="flex-1 overflow-y-auto" style="padding:4rem 4.5rem; position:relative;"></main>
</div>

  let currentLang = (function(){
    try{ const saved = localStorage.getItem("rapport_lang"); if(saved==='fr'||saved==='en') return saved; }catch(e){}
    return 'fr';
  })();

  function t(path, vars){
    const parts = path.split('.');
    let cur = I18N[currentLang];
    for(const p of parts){ cur = cur && cur[p]; }
    let str = (cur === undefined) ? path : cur;
    if(vars){ Object.keys(vars).forEach(k=>{ str = str.replace(new RegExp('\\{'+k+'\\}','g'), vars[k]); }); }
    return str;
  }
  function loc(){ return currentLang === 'en' ? 'en-US' : 'fr-FR'; }
  function setLang(lang){
    if(lang!=='fr' && lang!=='en') return;
    currentLang = lang;
    try{ localStorage.setItem("rapport_lang", lang); }catch(e){}
    document.documentElement.lang = lang;
    render();
  }
  function renderLangSwitch(){
    const html = `
      <button class="lang-btn ${currentLang==='fr'?'active':''}" data-action="set-lang" data-lang="fr">FR</button>

    if(el) el.innerHTML = html;

  /* ---------- Storage ---------- */
  const STORAGE_KEY = "rapport_data_v1";
  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {clients:[], reports:[]};
      const parsed = JSON.parse(raw);
      return {clients: parsed.clients||[], reports: parsed.reports||[]};
    }catch(e){ return {clients:[], reports:[]}; }
  }
  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ console.error("Local save failed", e); }
  }

  let data = loadData();
  let state = { clientId: null, reportId: null, mode: "welcome" }; // mode: welcome|reports|form|preview|new-client|edit-client|settings

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  /* ---------- Utils: numbers & formatting ---------- */
  function toNum(v){
    if(v === "" || v === null || v === undefined) return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function isValidMetric(v, allowEmpty){
    if(v === "" || v === null || v === undefined) return allowEmpty;
    const n = Number(v);
    return Number.isFinite(n) && n >= 0;
  }
  function fmtInt(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : Math.round(v).toLocaleString(loc()); }
  function fmtDec(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function fmtCur(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString(loc(),{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }
  function fmtPct(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}) + " %"; }
  function safeDiv(n, d){
    if(n===null||n===undefined||d===null||d===undefined||!Number.isFinite(n)||!Number.isFinite(d)||d===0) return null;
    return n/d;
  }
  function safePct(n, d){ const r = safeDiv(n,d); return r===null ? null : r*100; }
  function monthLabel(m){
    if(!m) return "—";
    const [y,mo] = m.split("-");
    const names = t('months');
    const idx = parseInt(mo,10)-1;
    return ((Array.isArray(names) && names[idx]) || mo) + " " + y;
  }
  function nextMonthStr(m){
    const [y,mo] = m.split("-").map(Number);
    const d = new Date(y, mo, 1);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function currentMonthStr(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function plural(n){ return n===1 ? '' : 's'; }

  /* ---------- Fix: KPI tiles auto-shrink to fit (no overflow/clipping on long numbers) ---------- */
  function fitKpiValues(){
    document.querySelectorAll('.kpi-value').forEach(el=>{
      const max = parseFloat(window.getComputedStyle(el).fontSize);
      let size = max;
      el.style.fontSize = size + 'px';
      let guard = 0;
      while(el.scrollWidth > el.clientWidth && size > 15 && guard < 60){
        size -= 1;
        el.style.fontSize = size + 'px';
        guard++;
      }
    });
  }

  /* ---------- Derived metrics ---------- */
  function computePlatform(p){
    const spend = toNum(p.spend), impressions = toNum(p.impressions), clicks = toNum(p.clicks), leads = toNum(p.leads);
    return {
      spend, impressions, clicks, leads,
      ctr: safePct(clicks, impressions),
      cpc: safeDiv(spend, clicks),
      cpl: safeDiv(spend, leads)
    };
  }
  function computeWebsite(w){
    const sessions = toNum(w.sessions), users = toNum(w.users), conversions = toNum(w.conversions);
    return { sessions, users, conversions, convRate: safePct(conversions, sessions) };
  }
  function computeEmail(e){
    return { sent: toNum(e.sent), openRate: toNum(e.openRate), clickRate: toNum(e.clickRate) };
  }
  function computeReport(r){
    return {
      meta: computePlatform(r.meta||{}),
      google: computePlatform(r.google||{}),
      website: computeWebsite(r.website||{}),
      email: computeEmail(r.email||{}),
      custom: (r.custom||[]).map(c=>({label:c.label, value: toNum(c.value)}))
    };
  }
  function getPreviousReport(report){
    const siblings = data.reports
      .filter(r => r.clientId === report.clientId && r.month < report.month)
      .sort((a,b) => a.month < b.month ? 1 : -1);
    return siblings[0] || null;
  }
  function delta(curr, prev){
    if(curr===null||prev===null||prev===0) return null;
    return ((curr-prev)/prev)*100;
  }
  function deltaBadge(d){
    if(d===null||isNaN(d)) return '<span class="text-muted text-xs">—</span>';
    const cls = d>0.001 ? "delta-up" : (d<-0.001 ? "delta-down" : "delta-flat");
    const arrow = d>0.001 ? "▲" : (d<-0.001 ? "▼" : "▬");
    return `<span class="delta ${cls} font-mono">${arrow} ${Math.abs(d).toLocaleString(loc(),{maximumFractionDigits:1})}%</span>`;
  }

    return months.map((m,i)=>({ id: uid("report"), clientId, month: m, isExample:true, ...base[i] }));

    state = { clientId: c.id, reportId: null, mode: "reports" };
    render();
  }
  function removeExampleData(){
    if(!confirm(t('alerts.confirmClearExample'))) return;
    const exClients = data.clients.filter(c=>c.isExample).map(c=>c.id);
    data.clients = data.clients.filter(c=>!c.isExample);
    data.reports = data.reports.filter(r=>!exClients.includes(r.clientId));
    saveData();

    render();

  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------- Rendering: main router ---------- */
  function render(){
    renderSidebar();

    else if(state.mode === "settings") renderSettings(main);
    else if(state.mode === "welcome" || !state.clientId) renderWelcome(main);
    else {
      const client = data.clients.find(c=>c.id===state.clientId);
      if(!client){ state = {clientId:null, reportId:null, mode:"welcome"}; renderWelcome(main); }
      else if(state.mode === "reports") renderReportsList(main, client);
      else if(state.mode === "form") renderReportForm(main, client, state.reportId);
      else if(state.mode === "preview") renderReportPreview(main, client, state.reportId);
      else if(state.mode === "edit-client") renderClientForm(main, client);
      else renderReportsList(main, client);

    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2D7FE0';
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = border;
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.font.size = 11;

    const clientsWithLatest = data.clients.map(c=>({ c, latest: latestReportFor(c.id) })).filter(x=>x.latest);
    const spendCtx = document.getElementById('chartClientSpend');
    if(spendCtx){
      dashboardCharts.push(new Chart(spendCtx, {
        type: 'bar',
        data: {
          labels: clientsWithLatest.map(x=>x.c.name),
          datasets: [{
            label: t('dashboard.kpiSpend'),
            data: clientsWithLatest.map(x=>{ const cd = computeReport(x.latest); return (cd.meta.spend||0)+(cd.google.spend||0); }),
            backgroundColor: clientsWithLatest.map(x=>x.c.color||accentColor),
            borderRadius: 8, maxBarThickness: 44
          }]
        },
        options: {
          plugins:{ legend:{display:false} },
          scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } }
        }
      }));
    }

    const allMonths = Array.from(new Set(data.reports.map(r=>r.month))).sort();
    const trendCtx = document.getElementById('chartGlobalTrend');
    if(trendCtx){
      const ctx2d = trendCtx.getContext('2d');
      const grad = ctx2d.createLinearGradient(0,0,0,200);
      grad.addColorStop(0, accentColor+'33');
      grad.addColorStop(1, accentColor+'00');
      dashboardCharts.push(new Chart(ctx2d, {
        type: 'line',
        data: {
          labels: allMonths.map(m=>monthLabel(m)),
          datasets: [{
            label: t('dashboard.kpiSpend'),
            data: allMonths.map(m=>{
              return data.reports.filter(r=>r.month===m).reduce((sum,r)=>{
                const cd = computeReport(r);
                return sum + (cd.meta.spend||0) + (cd.google.spend||0);
              }, 0);

            borderColor: accentColor, backgroundColor: grad, fill:true, tension:.35, borderWidth:2.5, pointRadius:3, pointBackgroundColor: accentColor, pointBorderColor:'#fff', pointBorderWidth:2
          }]
        },
        options: {
          plugins:{ legend:{display:false} },
          scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } }
        }
      }));
    }
  }

  const FIELD_DEFS = [
    ["meta","spend"],["meta","impressions"],["meta","clicks"],["meta","leads"],
    ["google","spend"],["google","impressions"],["google","clicks"],["google","leads"],

    ["email","sent"],["email","openRate"],["email","clickRate"]

    "meta.spend":["meta spend","facebook spend","amount spent (meta)","dépense meta","spend meta"],
    "meta.impressions":["meta impressions","facebook impressions"],
    "meta.clicks":["meta clicks","facebook clicks","meta clics","link clicks (meta)"],
    "meta.leads":["meta leads","meta results","facebook leads"],
    "google.spend":["google spend","adwords spend","dépense google","cost (google)"],
    "google.impressions":["google impressions","adwords impressions"],
    "google.clicks":["google clicks","adwords clicks","google clics"],
    "google.leads":["google leads","google conversions","adwords leads"],
    "website.sessions":["sessions"],
    "website.users":["users","utilisateurs"],
    "website.conversions":["conversions"],
    "email.sent":["sent","envoyés","emails sent"],
    "email.openRate":["open rate","taux d'ouverture","open %"],

      </form>

    const customContainer = document.getElementById("customRows");

      row.className = "flex gap-2 items-start custom-row";
      row.innerHTML = `

        <button type="button" class="btn btn-danger btn-sm remove-row">✕</button>
      `;
      row.querySelector(".remove-row").onclick = () => row.remove();
      customContainer.appendChild(row);
    }
    customRows.forEach(c => addCustomRow(c.label, c.value===null||c.value===undefined?"":c.value));
    document.getElementById("addCustomRow").onclick = () => addCustomRow();

    const dupBtn = document.getElementById("duplicateLastMonth");
    if(dupBtn){
      dupBtn.onclick = () => {
        const form = document.getElementById("reportForm");
        const monthField = form.querySelector('[name="month"]');
        if(!monthField.value) monthField.value = nextMonthStr(latestPrior.month);
        ["meta","google","website","email"].forEach(section=>{
          Object.keys(latestPrior[section]||{}).forEach(key=>{
            const input = form.querySelector(`[name="${section}.${key}"]`);
            if(input) input.value = latestPrior[section][key] ?? "";
          });
        });
        customContainer.innerHTML = "";
        (latestPrior.custom||[]).forEach(c => addCustomRow(c.label, c.value===null||c.value===undefined?"":c.value));
      };
    }

    /* ---- Excel / CSV import ---- */
    document.getElementById("importFileBtn").onclick = () => document.getElementById("importFileInput").click();
    document.getElementById("importFileInput").onchange = (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try{
          const wb = XLSX.read(ev.target.result, {type:"array"});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""})
            .map(row => row.map(cell => cell===null||cell===undefined ? "" : cell))
            .filter(row => row.some(cell => String(cell).trim() !== ""));
          if(rows.length === 0){ alert(t('importModal.noData')); return; }
          openImportModal(rows, document.getElementById("reportForm"));
        }catch(err){
          alert(t('importModal.parseError'));
        }
      };
      reader.readAsArrayBuffer(file);
    };

    document.getElementById("cancelReport").onclick = () => { state.mode = "reports"; render(); };

    document.getElementById("reportForm").onsubmit = (e) => {
      e.preventDefault();
      const form = e.target;
      let hasError = false;
      form.querySelectorAll(".err-msg").forEach(el=>el.classList.add("hidden"));
      form.querySelectorAll("input").forEach(el=>el.classList.remove("field-err"));

      const monthInput = form.querySelector('[name="month"]');
      if(!monthInput.value){
        showErr(form, "month", t('reportForm.monthRequired'));
        monthInput.classList.add("field-err");
        hasError = true;
      }

      const metricFields = form.querySelectorAll('[data-metric]');
      metricFields.forEach(input => {
        const v = input.value;
        if(!isValidMetric(v, true)){
          showErr(form, input.dataset.metric, t('reportForm.metricPositive'));
          input.classList.add("field-err");
          hasError = true;
        }
      });

      // email rates should not exceed 100
      ["email.openRate","email.clickRate"].forEach(key=>{
        const input = form.querySelector(`[data-metric="${key}"]`);
        if(input && input.value !== "" && Number(input.value) > 100){
          showErr(form, key, t('reportForm.metricRange'));
          input.classList.add("field-err");
          hasError = true;
        }
      });

      if(hasError) return;

      const fd = new FormData(form);
      function g(name){ const v = fd.get(name); return v===null||v==="" ? "" : v; }

      const newReport = {
        id: r.id, clientId: client.id, month: fd.get("month"), isExample: existing ? existing.isExample : false,
        meta: { spend:g("meta.spend"), impressions:g("meta.impressions"), clicks:g("meta.clicks"), leads:g("meta.leads") },
        google: { spend:g("google.spend"), impressions:g("google.impressions"), clicks:g("google.clicks"), leads:g("google.leads") },
        website: { sessions:g("website.sessions"), users:g("website.users"), conversions:g("website.conversions") },
        email: { sent:g("email.sent"), openRate:g("email.openRate"), clickRate:g("email.clickRate") },
        custom: Array.from(customContainer.querySelectorAll(".custom-row")).map(row => ({
          label: row.querySelector(".custom-label").value.trim(),
          value: row.querySelector(".custom-value").value
        })).filter(c => c.label !== "")
      };

      // prevent duplicate month for same client (except when editing same report)
      const dup = data.reports.find(rep => rep.clientId===client.id && rep.month===newReport.month && rep.id!==newReport.id);
      if(dup){
        showErr(form, "month", t('reportForm.monthDuplicate'));
        monthInput.classList.add("field-err");
        return;
      }

      if(existing){
        const idx = data.reports.findIndex(rep=>rep.id===existing.id);
        data.reports[idx] = newReport;
      }else{
        data.reports.push(newReport);
      }
      saveData();
      state.reportId = newReport.id;
      state.mode = "preview";
      render();
    };

    function showErr(form, key, msg){
      const el = form.querySelector(`[data-err="${key}"]`);
      if(el){ el.textContent = msg; el.classList.remove("hidden"); }
    }
  }

  /* ---------- Import mapping modal ---------- */
  function guessColumn(headerRow, fieldKey){
    const synonyms = FIELD_SYNONYMS[fieldKey] || [];
    const platform = fieldKey.split('.')[0]; // meta | google | website | email
    for(let i=0;i<headerRow.length;i++){
      const h = String(headerRow[i]).toLowerCase().trim();
      if(!h) continue;
      const matchesSynonym = synonyms.some(s => h.includes(s));
      if(matchesSynonym){
        if(platform==='meta' && /google|adwords/.test(h)) continue;
        if(platform==='google' && /meta|facebook/.test(h)) continue;
        return i;
      }
    }
    return -1;
  }

  function openImportModal(rows, form){
    const headerRow = rows[0] || [];
    const defaultDataRow = rows.length > 1 ? 1 : 0;

    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop no-print";
    backdrop.innerHTML = `
      <div class="modal-panel">
        <h3 class="headline font-bold mb-2" style="font-size:1.4rem;">${t('importModal.title')}</h3>
        <p class="text-muted text-sm mb-5">${t('importModal.desc')}</p>

        <label class="field-label">${t('importModal.rowLabel')}</label>
        <select id="importRowSelect" class="mb-5">
          ${rows.map((row,i)=>`<option value="${i}" ${i===defaultDataRow?'selected':''}>${escapeHtml(t('importModal.rowOption',{n:i+1, preview:row.slice(0,4).join(', ')}))}</option>`).join("")}
        </select>

        <div id="importFieldMaps"></div>

        <div class="flex gap-2 mt-6">
          <button type="button" class="btn btn-primary" id="importConfirmBtn">${t('importModal.confirm')}</button>
          <button type="button" class="btn btn-ghost" id="importCancelBtn">${t('clientForm.cancel')}</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);

    const mapsEl = backdrop.querySelector("#importFieldMaps");
    mapsEl.innerHTML = FIELD_DEFS.map(([section,key])=>{
      const fieldKey = section+'.'+key;
      const guessed = guessColumn(headerRow, fieldKey);
      return `
        <div class="map-row">
          <label class="field-label" style="margin-bottom:0;">${t('reportForm.'+(section==='meta'||section==='google'?(section==='meta'?'metaAds':'googleAds'):section==='website'?'website':'email'))} — ${t('reportForm.'+key)}</label>
          <select data-field="${fieldKey}">
            <option value="">${t('common.ignore')}</option>
            ${headerRow.map((h,i)=>`<option value="${i}" ${i===guessed?'selected':''}>${escapeHtml(String(h) || ('Col ' + (i+1)))}</option>`).join("")}
          </select>
        </div>`;
    }).join("");

    function closeModal(){ backdrop.remove(); }
    backdrop.addEventListener("click", (e) => { if(e.target === backdrop) closeModal(); });
    backdrop.querySelector("#importCancelBtn").onclick = closeModal;
    backdrop.querySelector("#importConfirmBtn").onclick = () => {
      const rowIdx = parseInt(backdrop.querySelector("#importRowSelect").value, 10);
      const dataRow = rows[rowIdx] || [];
      mapsEl.querySelectorAll('[data-field]').forEach(sel => {
        const colIdx = sel.value;
        if(colIdx === "") return;
        const val = dataRow[parseInt(colIdx,10)];
        if(val === undefined) return;
        const input = form.querySelector(`[name="${sel.dataset.field}"]`);
        if(input) input.value = String(val).trim();
      });
      closeModal();
      alert(t('importModal.imported'));
    };
  }

  /* ---------- Report preview ---------- */
  let chartInstances = [];
  function destroyCharts(){ chartInstances.forEach(c=>c.destroy()); chartInstances = []; }

  function renderReportPreview(main, client, reportId){
    const report = data.reports.find(r=>r.id===reportId);
    if(!report){ state.mode = "reports"; return render(); }
    const d = computeReport(report);
    const prev = getPreviousReport(report);
    const dPrev = prev ? computeReport(prev) : null;

    const totalSpend = (d.meta.spend||0) + (d.google.spend||0);
    const totalLeads = (d.meta.leads||0) + (d.google.leads||0);
    const blendedCpl = safeDiv(totalSpend, totalLeads);

    const prevTotalSpend = dPrev ? (dPrev.meta.spend||0) + (dPrev.google.spend||0) : null;
    const prevTotalLeads = dPrev ? (dPrev.meta.leads||0) + (dPrev.google.leads||0) : null;

    main.innerHTML = `
      <div class="flex items-center justify-between mb-5 no-print flex-wrap gap-2">
        <button class="btn btn-ghost btn-sm" data-action="back-to-reports">${t('preview.back')}</button>
        <div class="flex gap-2">
          <button class="btn btn-ghost btn-sm" data-action="edit-report" data-id="${report.id}">${t('preview.edit')}</button>
          <button class="btn btn-primary btn-sm" data-action="export-csv" data-id="${report.id}">${t('preview.exportCsv')}</button>
        </div>
      </div>

      <div class="no-print surface card text-sm flex items-center gap-2.5 mb-8" style="color:var(--muted); padding:.9rem 1.25rem;">
        <span style="width:1.5rem; height:1.5rem; border-radius:999px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.75rem; flex-shrink:0;">i</span>
        <span>${t('preview.pdfNote')}</span>
      </div>

      <div id="reportSheet" class="surface card" style="max-width:920px; padding:3rem; overflow:hidden; position:relative;">
        <div style="position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg, ${escapeAttr(client.color||'#2D7FE0')}, var(--accent-2));"></div>
        <div class="flex items-center justify-between mb-2 flex-wrap gap-3">
          <div style="min-width:0;">
            <h2 class="headline font-bold" style="font-size:2.5rem; line-height:1.1; overflow-wrap:break-word;">${escapeHtml(client.name)}</h2>
            <p class="text-muted mt-3" style="font-size:1.02rem;">${t('preview.monthly',{month:monthLabel(report.month)})} ${report.isExample?`<span class="badge badge-example">${t('common.example')}</span>`:''}</p>
          </div>
        </div>

        <div class="grid gap-4 mt-10 mb-4" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));">
          <div class="kpi-card">
            <span class="eyebrow">${t('preview.kpiSpend')}</span>
            <p class="kpi-value">${fmtCur(totalSpend)}</p>
            ${deltaBadge(delta(totalSpend, prevTotalSpend))}
          </div>
          <div class="kpi-card">
            <span class="eyebrow">${t('preview.kpiLeads')}</span>
            <p class="kpi-value">${fmtInt(totalLeads)}</p>
            ${deltaBadge(delta(totalLeads, prevTotalLeads))}
          </div>
          <div class="kpi-card">
            <span class="eyebrow">${t('preview.kpiCpl')}</span>
            <p class="kpi-value">${fmtCur(blendedCpl)}</p>
            ${deltaBadge(delta(blendedCpl, dPrev ? safeDiv(prevTotalSpend, prevTotalLeads) : null))}
          </div>
          <div class="kpi-card">
            <span class="eyebrow">${t('preview.kpiConversions')}</span>
            <p class="kpi-value">${fmtInt(d.website.conversions)}</p>
            ${deltaBadge(delta(d.website.conversions, dPrev ? dPrev.website.conversions : null))}
          </div>
        </div>

        <div class="flex flex-col gap-4 mt-6">
          <div class="surface card p-6">${platformTable(t('reportForm.metaAds'), d.meta, dPrev?dPrev.meta:null, [["spend","cur"],["impressions","int"],["clicks","int"],["leads","int"],["ctr","pct"],["cpc","cur"],["cpl","cur"]])}</div>
          <div class="surface card p-6">${platformTable(t('reportForm.googleAds'), d.google, dPrev?dPrev.google:null, [["spend","cur"],["impressions","int"],["clicks","int"],["leads","int"],["ctr","pct"],["cpc","cur"],["cpl","cur"]])}</div>
          <div class="surface card p-6">${platformTable(t('reportForm.website'), d.website, dPrev?dPrev.website:null, [["sessions","int"],["users","int"],["conversions","int"],["convRate","pct"]])}</div>
          <div class="surface card p-6">${platformTable(t('reportForm.email'), d.email, dPrev?dPrev.email:null, [["sent","int"],["openRate","pct"],["clickRate","pct"]])}</div>
          ${d.custom.length ? `<div class="surface card p-6">${customTable(d.custom, dPrev?dPrev.custom:null)}</div>` : ""}
        </div>

        <div class="mt-8">
          <div class="eyebrow mb-4">${t('preview.visualizations')}</div>
          <div class="grid gap-4" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));">
            <div class="surface card p-5"><p class="eyebrow mb-3">${t('preview.chartSpend')}</p><canvas id="chartSpend" height="200"></canvas></div>
            <div class="surface card p-5"><p class="eyebrow mb-3">${t('preview.chartLeads')}</p><canvas id="chartLeads" height="200"></canvas></div>
            <div class="surface card p-5"><p class="eyebrow mb-3">${t('preview.chartTrend')}</p><canvas id="chartTrend" height="200"></canvas></div>
          </div>
        </div>
      </div>
    `;

    destroyCharts();
    const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#6D7178';
    const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#E7EDF3';
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2D7FE0';
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = border;
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.font.size = 11;
    const legendLabelOpts = { color: muted, font:{ size:11, family:"'Inter', sans-serif", weight:'600' }, boxWidth:8, boxHeight:8, padding:16, usePointStyle:true, pointStyle:'circle' };

    chartInstances.push(new Chart(document.getElementById('chartSpend'), {
      type: 'doughnut',
      data: {
        labels: [t('reportForm.metaAds'), t('reportForm.googleAds')],
        datasets: [{ data: [d.meta.spend||0, d.google.spend||0], backgroundColor: [accentColor, border], borderWidth:0 }]
      },
      options: { plugins:{legend:{position:'bottom', labels:legendLabelOpts}}, cutout:'72%' }
    }));

    chartInstances.push(new Chart(document.getElementById('chartLeads'), {
      type: 'bar',
      data: {
        labels: [t('reportForm.metaAds'), t('reportForm.googleAds'), t('reportForm.website')],
        datasets: [{ label:'Volume', data: [d.meta.leads||0, d.google.leads||0, d.website.conversions||0], backgroundColor: accentColor, borderRadius:8, maxBarThickness:40 }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } } }
    }));

    const clientReports = data.reports.filter(r=>r.clientId===client.id).sort((a,b)=> a.month < b.month ? -1 : 1);
    const trendCtx = document.getElementById('chartTrend').getContext('2d');
    const trendGradient = trendCtx.createLinearGradient(0,0,0,200);
    trendGradient.addColorStop(0, accentColor+'3D');
    trendGradient.addColorStop(1, accentColor+'00');
    chartInstances.push(new Chart(trendCtx, {
      type: 'line',
      data: {
        labels: clientReports.map(r=>monthLabel(r.month)),
        datasets: [{
          label: t('preview.kpiSpend'),
          data: clientReports.map(r=>{ const cd = computeReport(r); return (cd.meta.spend||0)+(cd.google.spend||0); }),
          borderColor: accentColor, backgroundColor: trendGradient,
          fill:true, tension:.4, borderWidth:2.5, pointRadius: clientReports.map(r=> r.id===report.id ? 5 : 3), pointBackgroundColor: accentColor, pointBorderColor: '#fff', pointBorderWidth:2
        }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:border, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } } }
    }));
  }

  function rowMetric(label, type, curr, prevVal){
    const fmt = type==='cur' ? fmtCur : (type==='pct' ? fmtPct : (type==='dec' ? fmtDec : fmtInt));
    return `<tr>
      <td class="py-3 text-sm text-muted">${label}</td>
      <td class="py-3 text-sm font-mono text-right">${fmt(curr)}</td>
      <td class="py-3 text-right">${prevVal===undefined ? '' : deltaBadge(delta(curr, prevVal))}</td>
    </tr>`;
  }
  const PREVIEW_ONLY_KEYS = ['ctr','cpc','cpl','convRate'];
  function metricLabel(key){ return PREVIEW_ONLY_KEYS.includes(key) ? t('preview.'+key) : t('reportForm.'+key); }
  function platformTable(title, curr, prev, defs){
    return `
      <div class="eyebrow mb-4">${title}</div>
      <table>
        <thead><tr class="text-left">
          <th class="py-2 text-xs text-muted font-semibold">${t('preview.indicator')}</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">${t('preview.value')}</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">${t('preview.vsPrevious')}</th>
        </tr></thead>
        <tbody>
          ${defs.map(([key,type]) => rowMetric(metricLabel(key), type, curr[key], prev ? prev[key] : undefined)).join("")}
        </tbody>
      </table>`;
  }
  function customTable(curr, prev){
    return `
      <div class="eyebrow mb-4">${t('preview.customMetrics')}</div>
      <table>
        <thead><tr class="text-left">
          <th class="py-2 text-xs text-muted font-semibold">${t('preview.indicator')}</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">${t('preview.value')}</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">${t('preview.vsPrevious')}</th>
        </tr></thead>
        <tbody>
          ${curr.map(c => {
            const prevItem = prev ? prev.find(p=>p.label===c.label) : null;
            return rowMetric(escapeHtml(c.label), 'dec', c.value, prevItem ? prevItem.value : undefined);
          }).join("")}
        </tbody>
      </table>`;
  }

  /* ---------- CSV export ---------- */
  function exportCsv(reportId){
    const report = data.reports.find(r=>r.id===reportId);
    const client = data.clients.find(c=>c.id===report.clientId);
    const d = computeReport(report);
    const rows = [[t('csvExport.section'), t('csvExport.indicator'), t('csvExport.value')]];
    rows.push([t('csvExport.client'), t('csvExport.name'), client.name]);
    rows.push([t('csvExport.report'), t('csvExport.month'), monthLabel(report.month)]);
    const push = (section, label, val) => rows.push([section,label, val===null||val===undefined||isNaN(val) ? "" : val]);

    const metaAds = t('reportForm.metaAds'), googleAds = t('reportForm.googleAds'), website = t('reportForm.website'), email = t('reportForm.email');

    push(metaAds, t('reportForm.spend'), d.meta.spend); push(metaAds, t('reportForm.impressions'), d.meta.impressions);
    push(metaAds, t('reportForm.clicks'), d.meta.clicks); push(metaAds, t('reportForm.leads'), d.meta.leads);
    push(metaAds, t('preview.ctr'), d.meta.ctr); push(metaAds, t('preview.cpc'), d.meta.cpc); push(metaAds, t('preview.cpl'), d.meta.cpl);

    push(googleAds, t('reportForm.spend'), d.google.spend); push(googleAds, t('reportForm.impressions'), d.google.impressions);
    push(googleAds, t('reportForm.clicks'), d.google.clicks); push(googleAds, t('reportForm.leads'), d.google.leads);
    push(googleAds, t('preview.ctr'), d.google.ctr); push(googleAds, t('preview.cpc'), d.google.cpc); push(googleAds, t('preview.cpl'), d.google.cpl);

    push(website, t('reportForm.sessions'), d.website.sessions); push(website, t('reportForm.users'), d.website.users);
    push(website, t('reportForm.conversions'), d.website.conversions); push(website, t('preview.convRate'), d.website.convRate);

    push(email, t('reportForm.sent'), d.email.sent); push(email, t('reportForm.openRate'), d.email.openRate); push(email, t('reportForm.clickRate'), d.email.clickRate);

    d.custom.forEach(c => push(t('csvExport.custom'), c.label, c.value));

    const csv = rows.map(row => row.map(cell => {
      const s = String(cell===null||cell===undefined?"":cell);
      return /[",;\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    }).join(";")).join("\r\n");

    const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `rapport_${client.name.replace(/[^a-z0-9]+/gi,'_')}_${report.month}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- Event delegation ---------- */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if(action === "select-client"){ state = {clientId:id, reportId:null, mode:"reports"}; render(); }
    else if(action === "new-client"){ state.mode = "new-client"; render(); }
    else if(action === "edit-client"){ state.mode = "edit-client"; render(); }
    else if(action === "load-example"){ loadExample(); }
    else if(action === "clear-example"){ removeExampleData(); }
    else if(action === "go-dashboard"){ state = {clientId:null, reportId:null, mode:"welcome"}; render(); }
    else if(action === "go-settings"){ state.mode = "settings"; render(); }
    else if(action === "set-lang"){ setLang(el.dataset.lang); }
    else if(action === "new-report"){ state.reportId = null; state.mode = "form"; render(); }
    else if(action === "open-report"){ state.reportId = id; state.mode = "preview"; render(); }
    else if(action === "edit-report"){ state.reportId = id; state.mode = "form"; render(); }
    else if(action === "delete-report"){
      if(confirm(t('reportsList.confirmDeleteReport'))){
        data.reports = data.reports.filter(r=>r.id!==id);
        saveData();
        render();
      }
    }
    else if(action === "back-to-reports"){ state.mode = "reports"; state.reportId = null; render(); }
    else if(action === "export-csv"){ exportCsv(id); }
  });

  window.addEventListener("resize", () => { fitKpiValues(); });

  /* ---------- Init ---------- */
  document.documentElement.lang = currentLang;
  render();

  // offer example removal via console-accessible hook if example exists and user wants to clear it
  window.__rapport_removeExample = removeExampleData;
})();
</script>
</body>
</html>
