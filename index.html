<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport — Reporting marketing mensuel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F2; --bg-2:#F2EBDF; --ink:#1E1A16; --fg:#1E1A16;
    --muted:#8C8072; --muted-2:#D9CFBF; --rule:#D9CFBF;
    --accent:#7A2B26; --accent-fg:#FAF7F2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15120F; --bg-2:#1E1A15; --ink:#F3ECE1; --fg:#F3ECE1;
      --muted:#A89C8C; --muted-2:#3A332B; --rule:#3A332B;
      --accent:#C1584C; --accent-fg:#15120F;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15120F; --bg-2:#1E1A15; --ink:#F3ECE1; --fg:#F3ECE1;
    --muted:#A89C8C; --muted-2:#3A332B; --rule:#3A332B;
    --accent:#C1584C; --accent-fg:#15120F;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15px; -webkit-font-smoothing:antialiased;
  }
  .font-display, .headline{ font-family:'Fraunces',Georgia,serif; letter-spacing:-.01em; }
  .font-mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:'Inter',sans-serif; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
  .text-muted{ color:var(--muted); }
  .text-accent{ color:var(--accent); }
  .border-base{ border-color:var(--rule); }

  .surface{ background:var(--bg); border:1px solid var(--rule); }
  .card{ border-radius:3px; }

  .btn{
    display:inline-flex; align-items:center; gap:.5rem; padding:.6rem 1.15rem;
    font-family:'Inter',sans-serif; font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em;
    border-radius:2px; border:1px solid transparent; cursor:pointer; transition:background .15s, color .15s, border-color .15s;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .btn-primary:hover{ opacity:.88; }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--rule); }
  .btn-ghost:hover{ border-color:var(--ink); }
  .btn-danger{ background:transparent; color:var(--accent); border-color:transparent; }
  .btn-danger:hover{ border-color:var(--accent); }
  .btn-sm{ padding:.42rem .8rem; font-size:.68rem; }

  label.field-label{ display:block; font-family:'Inter',sans-serif; font-size:.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:.4rem; }

  input[type=text], input[type=month], input[type=number], input[type=color], textarea, select{
    background:transparent; color:var(--ink); border:1px solid var(--rule);
    border-radius:2px; padding:.55rem .7rem; font-size:.875rem; width:100%; font-family:'Inter',sans-serif;
    transition:border-color .15s;
  }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--accent); }
  .field-err{ border-color:var(--accent) !important; }
  .err-msg{ color:var(--accent); font-size:.72rem; margin-top:.35rem; font-weight:500; }

  .badge{
    font-family:'Inter',sans-serif; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    padding:.15rem .4rem; border:1px solid var(--accent); color:var(--accent); border-radius:2px; background:transparent;
  }
  .badge-example{ border-color:var(--accent); color:var(--accent); }

  .nav-item{
    padding:.5rem .9rem .5rem 1rem; border-left:2px solid transparent; color:var(--muted);
    font-size:.85rem; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .nav-item:hover{ color:var(--ink); }
  .nav-item.active{ border-left-color:var(--accent); color:var(--ink); font-weight:600; }

  .sidebar-item{
    padding:.45rem .9rem .45rem 1rem; border-left:2px solid transparent; cursor:pointer;
    display:flex; align-items:center; gap:.55rem; transition:border-color .15s;
  }
  .sidebar-item.active{ border-left-color:var(--accent); }
  .sidebar-item .cname{ color:var(--fg); }
  .sidebar-item.active .cname{ font-weight:600; }

  .scrollbar-thin::-webkit-scrollbar{ width:5px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--muted-2); border-radius:2px; }

  .delta-up{ color:var(--ink); font-weight:700; }
  .delta-down{ color:var(--muted); font-weight:600; font-style:italic; }
  .delta-flat{ color:var(--muted); }

  table{ border-collapse:collapse; width:100%; }
  tbody tr{ border-bottom:1px solid var(--rule); }
  thead tr{ border-bottom:1px solid var(--rule); }

  .kpi-row{ display:flex; flex-wrap:wrap; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .kpi-item{ flex:1 1 200px; padding:2.25rem 2rem; border-left:1px solid var(--rule); }
  .kpi-item:first-child{ border-left:none; padding-left:0; }
  .kpi-value{ font-family:'Fraunces',Georgia,serif; font-size:3.75rem; font-weight:500; line-height:1; margin:.75rem 0 .75rem; font-variant-numeric:tabular-nums; }
  @media (max-width: 860px){
    .kpi-value{ font-size:2.75rem; }
  }

  .report-section{ }
  .report-section + .report-section{ border-top:1px solid var(--rule); margin-top:3rem; padding-top:3rem; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; color:#111; }
  }
  @media (max-width: 860px){
    .app-shell{ flex-direction:column; }
    .sidebar{ width:100% !important; max-height:none; position:static !important; border-right:none !important; border-bottom:1px solid var(--rule); }
  }
</style>
</head>
<body>

<div class="app-shell flex min-h-screen">
  <aside class="sidebar no-print flex flex-col" style="width:220px; flex-shrink:0; background:var(--bg); border-right:1px solid var(--rule); position:sticky; top:0; height:100vh;">
    <div class="px-5 pt-6 pb-5">
      <div class="flex items-center gap-2">
        <span style="width:.5rem; height:.5rem; background:var(--accent); flex-shrink:0;"></span>
        <h1 class="headline font-semibold" style="font-size:1.6rem; line-height:1;">Rapport</h1>
      </div>
      <p class="eyebrow mt-2">Reporting marketing</p>
    </div>

    <nav class="flex flex-col gap-1">
      <div class="nav-item" id="navDashboard" data-action="go-dashboard">Tableau de bord</div>
    </nav>

    <div class="px-4 pt-6 pb-2">
      <span class="eyebrow">Clients</span>
    </div>
    <div id="clientList" class="flex flex-col gap-0.5 overflow-y-auto scrollbar-thin" style="max-height:calc(100vh - 360px);"></div>

    <div class="px-4 pt-4 flex flex-col gap-2">
      <button class="btn btn-primary w-full justify-center btn-sm" data-action="new-client">+ Nouveau client</button>
      <button class="btn btn-ghost w-full justify-center btn-sm" data-action="load-example">Charger client exemple</button>
    </div>

    <nav class="pt-4 pb-6 mt-auto flex flex-col gap-1" style="border-top:1px solid var(--rule); margin-top:auto;">
      <div class="nav-item" id="navSettings" data-action="go-settings">Paramètres</div>
    </nav>
  </aside>

  <main id="main" class="flex-1 overflow-y-auto" style="padding:4.5rem 5rem;"></main>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Storage ---------- */
  const STORAGE_KEY = "rapport_data_v1";
  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {clients:[], reports:[]};
      const parsed = JSON.parse(raw);
      return {clients: parsed.clients||[], reports: parsed.reports||[]};
    }catch(e){ return {clients:[], reports:[]}; }
  }
  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ console.error("Échec de la sauvegarde locale", e); }
  }

  let data = loadData();
  let state = { clientId: null, reportId: null, mode: "welcome" }; // mode: welcome|reports|form|preview|new-client|edit-client|settings

  function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  /* ---------- Utils: numbers & formatting ---------- */
  function toNum(v){
    if(v === "" || v === null || v === undefined) return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function isValidMetric(v, allowEmpty){
    if(v === "" || v === null || v === undefined) return allowEmpty;
    const n = Number(v);
    return Number.isFinite(n) && n >= 0;
  }
  function fmtInt(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : Math.round(v).toLocaleString('fr-FR'); }
  function fmtDec(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function fmtCur(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }
  function fmtPct(v, d=2){ return (v===null||v===undefined||isNaN(v)) ? "—" : v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}) + " %"; }
  function safeDiv(n, d){
    if(n===null||n===undefined||d===null||d===undefined||!Number.isFinite(n)||!Number.isFinite(d)||d===0) return null;
    return n/d;
  }
  function safePct(n, d){ const r = safeDiv(n,d); return r===null ? null : r*100; }
  function monthLabel(m){
    if(!m) return "—";
    const [y,mo] = m.split("-");
    const names = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
    const idx = parseInt(mo,10)-1;
    return (names[idx]||mo) + " " + y;
  }

  /* ---------- Derived metrics ---------- */
  function computePlatform(p){
    const spend = toNum(p.spend), impressions = toNum(p.impressions), clicks = toNum(p.clicks), leads = toNum(p.leads);
    return {
      spend, impressions, clicks, leads,
      ctr: safePct(clicks, impressions),
      cpc: safeDiv(spend, clicks),
      cpl: safeDiv(spend, leads)
    };
  }
  function computeWebsite(w){
    const sessions = toNum(w.sessions), users = toNum(w.users), conversions = toNum(w.conversions);
    return { sessions, users, conversions, convRate: safePct(conversions, sessions) };
  }
  function computeEmail(e){
    return { sent: toNum(e.sent), openRate: toNum(e.openRate), clickRate: toNum(e.clickRate) };
  }
  function computeReport(r){
    return {
      meta: computePlatform(r.meta||{}),
      google: computePlatform(r.google||{}),
      website: computeWebsite(r.website||{}),
      email: computeEmail(r.email||{}),
      custom: (r.custom||[]).map(c=>({label:c.label, value: toNum(c.value)}))
    };
  }
  function getPreviousReport(report){
    const siblings = data.reports
      .filter(r => r.clientId === report.clientId && r.month < report.month)
      .sort((a,b) => a.month < b.month ? 1 : -1);
    return siblings[0] || null;
  }
  function delta(curr, prev){
    if(curr===null||prev===null||prev===0) return null;
    return ((curr-prev)/prev)*100;
  }
  function deltaBadge(d){
    if(d===null||isNaN(d)) return '<span class="text-muted text-xs">—</span>';
    const cls = d>0.001 ? "delta-up" : (d<-0.001 ? "delta-down" : "delta-flat");
    const arrow = d>0.001 ? "▲" : (d<-0.001 ? "▼" : "▬");
    return `<span class="${cls} text-xs font-mono">${arrow} ${Math.abs(d).toLocaleString('fr-FR',{maximumFractionDigits:1})}%</span>`;
  }

  /* ---------- Example data ---------- */
  function exampleClient(){
    return { id: uid("client"), name: "Client Exemple (Démo)", logo: "", color: "#7A2B26", isExample: true };
  }
  function exampleReports(clientId){
    const months = ["2026-05","2026-06","2026-07"];
    const base = [
      { meta:{spend:1200,impressions:85000,clicks:1700,leads:42}, google:{spend:950,impressions:40000,clicks:1100,leads:30},
        website:{sessions:9000,users:7200,conversions:220}, email:{sent:5000,openRate:28.4,clickRate:4.1}, custom:[{label:"Abonnés Instagram",value:3200}] },
      { meta:{spend:1350,impressions:91000,clicks:1950,leads:51}, google:{spend:980,impressions:42000,clicks:1180,leads:33},
        website:{sessions:9800,users:7700,conversions:255}, email:{sent:5100,openRate:30.1,clickRate:4.6}, custom:[{label:"Abonnés Instagram",value:3350}] },
      { meta:{spend:1280,impressions:88000,clicks:1860,leads:47}, google:{spend:1020,impressions:44500,clicks:1250,leads:35},
        website:{sessions:10100,users:8000,conversions:268}, email:{sent:5250,openRate:29.5,clickRate:4.3}, custom:[{label:"Abonnés Instagram",value:3480}] }
    ];
    return months.map((m,i)=>({ id: uid("report"), clientId, month: m, isExample:true, ...base[i] }));
  }
  function loadExample(){
    if(data.clients.some(c=>c.isExample)){
      alert("Le client exemple est déjà chargé.");
      return;
    }
    const c = exampleClient();
    data.clients.push(c);
    exampleReports(c.id).forEach(r=>data.reports.push(r));
    saveData();
    state = { clientId: c.id, reportId: null, mode: "reports" };
    render();
  }
  function removeExampleData(){
    if(!confirm("Supprimer le client exemple et ses rapports ?")) return;
    const exClients = data.clients.filter(c=>c.isExample).map(c=>c.id);
    data.clients = data.clients.filter(c=>!c.isExample);
    data.reports = data.reports.filter(r=>!exClients.includes(r.clientId));
    saveData();
    if(exClients.includes(state.clientId)){ state = {clientId:null, reportId:null, mode:"welcome"}; }
    render();
  }

  /* ---------- Rendering: sidebar ---------- */
  function renderSidebar(){
    const list = document.getElementById("clientList");
    if(data.clients.length === 0){
      list.innerHTML = `<p class="text-muted text-xs py-2 px-4">Aucun client pour l'instant.</p>`;
    }else{
      list.innerHTML = data.clients.map(c => `
        <div class="sidebar-item ${c.id===state.clientId?'active':''}" data-action="select-client" data-id="${c.id}">
          ${c.logo ? `<img src="${escapeAttr(c.logo)}" class="w-5 h-5 object-cover flex-shrink-0" style="border-radius:1px;" onerror="this.style.display='none'">` : `<span class="w-2.5 h-2.5 inline-block flex-shrink-0" style="background:${escapeAttr(c.color||'#7A2B26')}"></span>`}
          <span class="cname text-sm flex-1 truncate">${escapeHtml(c.name)}</span>
          ${c.isExample ? '<span class="badge badge-example">EX</span>' : ''}
        </div>
      `).join("");
    }
    const navDash = document.getElementById("navDashboard");
    const navSet = document.getElementById("navSettings");
    if(navDash) navDash.classList.toggle("active", state.mode === "welcome" || state.mode === "new-client");
    if(navSet) navSet.classList.toggle("active", state.mode === "settings");
  }

  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------- Rendering: main router ---------- */
  function render(){
    renderSidebar();
    const main = document.getElementById("main");
    if(state.mode === "new-client") return renderClientForm(main, null);
    if(state.mode === "settings") return renderSettings(main);
    if(state.mode === "welcome" || !state.clientId) return renderWelcome(main);
    const client = data.clients.find(c=>c.id===state.clientId);
    if(!client){ state = {clientId:null, reportId:null, mode:"welcome"}; return renderWelcome(main); }
    if(state.mode === "reports") return renderReportsList(main, client);
    if(state.mode === "form") return renderReportForm(main, client, state.reportId);
    if(state.mode === "preview") return renderReportPreview(main, client, state.reportId);
    if(state.mode === "edit-client") return renderClientForm(main, client);
    renderReportsList(main, client);
  }

  function renderWelcome(main){
    main.innerHTML = `
      <div class="h-full flex flex-col items-center justify-center text-center" style="max-width:480px; margin:0 auto;">
        <span style="width:.7rem; height:.7rem; background:var(--accent); display:inline-block; margin-bottom:2.25rem;"></span>
        <h2 class="headline font-semibold mb-5" style="font-size:3rem; line-height:1.05;">Bienvenue dans Rapport</h2>
        <p class="text-muted mb-10" style="font-size:1rem;">Créez un client pour commencer à construire vos rapports marketing mensuels. Toutes les données restent stockées localement dans votre navigateur.</p>
        <div class="flex gap-2">
          <button class="btn btn-primary" data-action="new-client">+ Nouveau client</button>
          <button class="btn btn-ghost" data-action="load-example">Charger un client exemple</button>
        </div>
      </div>`;
  }

  /* ---------- Settings ---------- */
  function renderSettings(main){
    const hasExample = data.clients.some(c=>c.isExample);
    main.innerHTML = `
      <div style="max-width:640px;">
        <h2 class="headline font-semibold mb-3" style="font-size:2.75rem;">Paramètres</h2>
        <p class="text-muted mb-10" style="font-size:1rem;">Gérez vos données locales. Rien n'est envoyé à un serveur : tout reste dans le stockage de votre navigateur.</p>

        <div class="eyebrow mb-4">Aperçu du stockage</div>
        <div class="kpi-row mb-12">
          <div class="kpi-item">
            <span class="eyebrow">Clients</span>
            <p class="kpi-value">${data.clients.length}</p>
          </div>
          <div class="kpi-item">
            <span class="eyebrow">Rapports</span>
            <p class="kpi-value">${data.reports.length}</p>
          </div>
        </div>

        <div class="eyebrow mb-3">Données exemple</div>
        <p class="text-muted text-sm mb-4">Le client exemple est clairement identifié et séparé de vos vraies données.</p>
        <div class="flex gap-2">
          <button class="btn btn-ghost btn-sm" data-action="load-example" ${hasExample?'disabled style="opacity:.4;cursor:not-allowed;"':''}>Charger le client exemple</button>
          <button class="btn btn-danger btn-sm" data-action="clear-example" ${hasExample?'':'disabled style="opacity:.4;cursor:not-allowed;"'}>Supprimer les données exemple</button>
        </div>
      </div>`;
  }

  /* ---------- Client form ---------- */
  function renderClientForm(main, existing){
    main.innerHTML = `
      <div style="max-width:440px;">
        <h2 class="headline font-semibold mb-8" style="font-size:2.25rem;">${existing ? "Modifier le client" : "Nouveau client"}</h2>
        <form id="clientForm" class="flex flex-col gap-5">
          <div>
            <label class="field-label">Nom du client *</label>
            <input type="text" name="name" required maxlength="80" value="${existing?escapeAttr(existing.name):''}">
            <div class="err-msg hidden" data-err="name"></div>
          </div>
          <div>
            <label class="field-label">Logo (URL, optionnel)</label>
            <input type="text" name="logo" value="${existing?escapeAttr(existing.logo||''):''}" placeholder="https://...">
          </div>
          <div>
            <label class="field-label">Couleur de marque</label>
            <input type="color" name="color" value="${existing?existing.color:'#7A2B26'}" style="height:2.8rem; padding:.25rem;">
          </div>
          <div class="flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <button type="button" class="btn btn-ghost" id="cancelClient">Annuler</button>
            ${existing && !existing.isExample ? `<button type="button" class="btn btn-danger" id="deleteClient">Supprimer le client</button>` : ''}
          </div>
        </form>
      </div>`;
    document.getElementById("cancelClient").onclick = () => {
      state.mode = state.clientId ? "reports" : "welcome";
      render();
    };
    if(existing && !existing.isExample){
      document.getElementById("deleteClient").onclick = () => {
        if(!confirm(`Supprimer "${existing.name}" et tous ses rapports ?`)) return;
        data.clients = data.clients.filter(c=>c.id!==existing.id);
        data.reports = data.reports.filter(r=>r.clientId!==existing.id);
        saveData();
        state = {clientId:null, reportId:null, mode:"welcome"};
        render();
      };
    }
    document.getElementById("clientForm").onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = (fd.get("name")||"").toString().trim();
      const errEl = e.target.querySelector('[data-err="name"]');
      const nameInput = e.target.querySelector('[name="name"]');
      if(!name){
        errEl.textContent = "Le nom est obligatoire.";
        errEl.classList.remove("hidden");
        nameInput.classList.add("field-err");
        return;
      }
      errEl.classList.add("hidden");
      nameInput.classList.remove("field-err");
      const logo = (fd.get("logo")||"").toString().trim();
      const color = (fd.get("color")||"#7A2B26").toString();
      if(existing){
        existing.name = name; existing.logo = logo; existing.color = color;
      }else{
        const c = { id: uid("client"), name, logo, color, isExample:false };
        data.clients.push(c);
        state.clientId = c.id;
      }
      saveData();
      state.mode = "reports";
      render();
    };
  }

  /* ---------- Reports list ---------- */
  function renderReportsList(main, client){
    const reports = data.reports.filter(r=>r.clientId===client.id).sort((a,b)=> a.month < b.month ? 1 : -1);
    main.innerHTML = `
      <div class="flex items-center justify-between mb-3 flex-wrap gap-3">
        <div class="flex items-center gap-4">
          ${client.logo ? `<img src="${escapeAttr(client.logo)}" class="w-12 h-12 object-cover" style="border-radius:2px;" onerror="this.style.display='none'">` : `<span class="w-3.5 h-3.5 inline-block" style="background:${escapeAttr(client.color)}"></span>`}
          <div>
            <h2 class="headline font-semibold flex items-center gap-3" style="font-size:2.5rem; line-height:1.05;">${escapeHtml(client.name)} ${client.isExample?'<span class="badge badge-example">EXEMPLE</span>':''}</h2>
          </div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-ghost btn-sm" data-action="edit-client">Modifier le client</button>
          <button class="btn btn-primary" data-action="new-report">+ Nouveau rapport</button>
        </div>
      </div>
      <p class="text-muted text-sm mb-10">${reports.length} rapport${reports.length===1?'':'s'}</p>
      <div class="eyebrow mb-4">Rapports récents</div>
      ${reports.length===0 ? `
        <div class="text-center py-20">
          <p class="headline text-muted" style="font-size:1.6rem;">Aucun rapport pour ce client.</p>
          <p class="text-muted text-sm mt-3">Créez le premier rapport mensuel pour commencer.</p>
        </div>
      ` : `
        <div class="grid gap-0" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); border-top:1px solid var(--rule); border-left:1px solid var(--rule);">
          ${reports.map(r => {
            const d = computeReport(r);
            const totalSpend = (d.meta.spend||0) + (d.google.spend||0);
            return `
            <div class="p-5 flex flex-col gap-3 cursor-pointer" style="border-right:1px solid var(--rule); border-bottom:1px solid var(--rule);" data-action="open-report" data-id="${r.id}">
              <div class="flex items-center justify-between">
                <span class="headline font-semibold" style="font-size:1.1rem;">${monthLabel(r.month)}</span>
                ${r.isExample?'<span class="badge badge-example">EX</span>':''}
              </div>
              <p class="text-muted text-xs font-mono">Dépenses totales — ${fmtCur(totalSpend)}</p>
              <div class="flex gap-2 mt-1">
                <button class="btn btn-ghost btn-sm" data-action="edit-report" data-id="${r.id}">Modifier</button>
                <button class="btn btn-danger btn-sm" data-action="delete-report" data-id="${r.id}">Supprimer</button>
              </div>
            </div>`;
          }).join("")}
        </div>
      `}
    `;
  }

  /* ---------- Report form ---------- */
  function emptyReport(clientId){
    return {
      id: uid("report"), clientId, month: "", isExample:false,
      meta:{spend:"",impressions:"",clicks:"",leads:""},
      google:{spend:"",impressions:"",clicks:"",leads:""},
      website:{sessions:"",users:"",conversions:""},
      email:{sent:"",openRate:"",clickRate:""},
      custom:[]
    };
  }

  function platformFieldsHtml(prefix, label, p, fieldDefs){
    return `
      <fieldset class="surface card p-5">
        <legend class="eyebrow px-1">${label}</legend>
        <div class="grid gap-4 mt-3" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">
          ${fieldDefs.map(([key,lbl])=>`
            <div>
              <label class="field-label">${lbl}</label>
              <input type="number" min="0" step="any" name="${prefix}.${key}" value="${p[key]!==undefined && p[key]!==null ? p[key] : ''}" data-metric="${prefix}.${key}">
              <div class="err-msg hidden" data-err="${prefix}.${key}"></div>
            </div>
          `).join("")}
        </div>
      </fieldset>`;
  }

  function renderReportForm(main, client, reportId){
    const existing = reportId ? data.reports.find(r=>r.id===reportId) : null;
    const r = existing ? JSON.parse(JSON.stringify(existing)) : emptyReport(client.id);
    const customRows = r.custom && r.custom.length ? r.custom : [];

    main.innerHTML = `
      <div class="flex items-center justify-between mb-8">
        <h2 class="headline font-semibold" style="font-size:2.1rem;">${existing ? "Modifier le rapport" : "Nouveau rapport"} — ${escapeHtml(client.name)}</h2>
        <button class="btn btn-ghost btn-sm" data-action="back-to-reports">← Retour</button>
      </div>
      <form id="reportForm" class="flex flex-col gap-6" style="max-width:720px;">
        <div class="surface card p-5">
          <label class="field-label">Mois du rapport *</label>
          <input type="month" name="month" required value="${r.month||''}" style="max-width:220px;">
          <div class="err-msg hidden" data-err="month"></div>
        </div>

        ${platformFieldsHtml("meta","Meta Ads", r.meta, [["spend","Dépense (€)"],["impressions","Impressions"],["clicks","Clics"],["leads","Leads"]])}
        ${platformFieldsHtml("google","Google Ads", r.google, [["spend","Dépense (€)"],["impressions","Impressions"],["clicks","Clics"],["leads","Leads"]])}
        ${platformFieldsHtml("website","Site web", r.website, [["sessions","Sessions"],["users","Utilisateurs"],["conversions","Conversions"]])}
        ${platformFieldsHtml("email","Email", r.email, [["sent","Emails envoyés"],["openRate","Taux d'ouverture (%)"],["clickRate","Taux de clic (%)"]])}

        <fieldset class="surface card p-5">
          <legend class="eyebrow px-1">Métriques personnalisées</legend>
          <div id="customRows" class="flex flex-col gap-2 mt-3"></div>
          <button type="button" class="btn btn-ghost btn-sm mt-3" id="addCustomRow">+ Ajouter une métrique</button>
        </fieldset>

        <div class="flex gap-2">
          <button type="submit" class="btn btn-primary">Enregistrer le rapport</button>
          <button type="button" class="btn btn-ghost" id="cancelReport">Annuler</button>
        </div>
      </form>
    `;

    const customContainer = document.getElementById("customRows");
    function addCustomRow(label="", value=""){
      const row = document.createElement("div");
      row.className = "flex gap-2 items-start custom-row";
      row.innerHTML = `
        <input type="text" class="custom-label" placeholder="Nom de la métrique" value="${escapeAttr(label)}" style="flex:2;">
        <input type="number" step="any" class="custom-value" placeholder="Valeur" value="${value}" style="flex:1;">
        <button type="button" class="btn btn-danger btn-sm remove-row">✕</button>
      `;
      row.querySelector(".remove-row").onclick = () => row.remove();
      customContainer.appendChild(row);
    }
    customRows.forEach(c => addCustomRow(c.label, c.value===null||c.value===undefined?"":c.value));
    document.getElementById("addCustomRow").onclick = () => addCustomRow();

    document.getElementById("cancelReport").onclick = () => { state.mode = "reports"; render(); };

    document.getElementById("reportForm").onsubmit = (e) => {
      e.preventDefault();
      const form = e.target;
      let hasError = false;
      form.querySelectorAll(".err-msg").forEach(el=>el.classList.add("hidden"));
      form.querySelectorAll("input").forEach(el=>el.classList.remove("field-err"));

      const monthInput = form.querySelector('[name="month"]');
      if(!monthInput.value){
        showErr(form, "month", "Le mois est obligatoire.");
        monthInput.classList.add("field-err");
        hasError = true;
      }

      const metricFields = form.querySelectorAll('[data-metric]');
      metricFields.forEach(input => {
        const v = input.value;
        if(!isValidMetric(v, true)){
          showErr(form, input.dataset.metric, "Doit être un nombre positif.");
          input.classList.add("field-err");
          hasError = true;
        }
      });

      // email rates should not exceed 100
      ["email.openRate","email.clickRate"].forEach(key=>{
        const input = form.querySelector(`[data-metric="${key}"]`);
        if(input && input.value !== "" && Number(input.value) > 100){
          showErr(form, key, "Doit être compris entre 0 et 100.");
          input.classList.add("field-err");
          hasError = true;
        }
      });

      if(hasError) return;

      const fd = new FormData(form);
      function g(name){ const v = fd.get(name); return v===null||v==="" ? "" : v; }

      const newReport = {
        id: r.id, clientId: client.id, month: fd.get("month"), isExample: existing ? existing.isExample : false,
        meta: { spend:g("meta.spend"), impressions:g("meta.impressions"), clicks:g("meta.clicks"), leads:g("meta.leads") },
        google: { spend:g("google.spend"), impressions:g("google.impressions"), clicks:g("google.clicks"), leads:g("google.leads") },
        website: { sessions:g("website.sessions"), users:g("website.users"), conversions:g("website.conversions") },
        email: { sent:g("email.sent"), openRate:g("email.openRate"), clickRate:g("email.clickRate") },
        custom: Array.from(customContainer.querySelectorAll(".custom-row")).map(row => ({
          label: row.querySelector(".custom-label").value.trim(),
          value: row.querySelector(".custom-value").value
        })).filter(c => c.label !== "")
      };

      // prevent duplicate month for same client (except when editing same report)
      const dup = data.reports.find(rep => rep.clientId===client.id && rep.month===newReport.month && rep.id!==newReport.id);
      if(dup){
        showErr(form, "month", "Un rapport existe déjà pour ce mois.");
        monthInput.classList.add("field-err");
        return;
      }

      if(existing){
        const idx = data.reports.findIndex(rep=>rep.id===existing.id);
        data.reports[idx] = newReport;
      }else{
        data.reports.push(newReport);
      }
      saveData();
      state.reportId = newReport.id;
      state.mode = "preview";
      render();
    };

    function showErr(form, key, msg){
      const el = form.querySelector(`[data-err="${key}"]`);
      if(el){ el.textContent = msg; el.classList.remove("hidden"); }
    }
  }

  /* ---------- Report preview ---------- */
  let chartInstances = [];
  function destroyCharts(){ chartInstances.forEach(c=>c.destroy()); chartInstances = []; }

  function renderReportPreview(main, client, reportId){
    const report = data.reports.find(r=>r.id===reportId);
    if(!report){ state.mode = "reports"; return render(); }
    const d = computeReport(report);
    const prev = getPreviousReport(report);
    const dPrev = prev ? computeReport(prev) : null;

    const totalSpend = (d.meta.spend||0) + (d.google.spend||0);
    const totalLeads = (d.meta.leads||0) + (d.google.leads||0);
    const blendedCpl = safeDiv(totalSpend, totalLeads);

    const prevTotalSpend = dPrev ? (dPrev.meta.spend||0) + (dPrev.google.spend||0) : null;
    const prevTotalLeads = dPrev ? (dPrev.meta.leads||0) + (dPrev.google.leads||0) : null;

    main.innerHTML = `
      <div class="flex items-center justify-between mb-5 no-print flex-wrap gap-2">
        <button class="btn btn-ghost btn-sm" data-action="back-to-reports">← Retour aux rapports</button>
        <div class="flex gap-2">
          <button class="btn btn-ghost btn-sm" data-action="edit-report" data-id="${report.id}">Modifier</button>
          <button class="btn btn-primary btn-sm" data-action="export-csv" data-id="${report.id}">Exporter en CSV</button>
        </div>
      </div>

      <div class="no-print text-sm flex items-center gap-2.5 mb-9" style="color:var(--muted); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:.9rem 0;">
        <span style="width:.4rem; height:.4rem; background:var(--accent); flex-shrink:0;"></span>
        <span>Pour enregistrer en PDF, utilisez la fonction d'impression de votre navigateur (Ctrl+P / Cmd+P).</span>
      </div>

      <div id="reportSheet" style="max-width:900px; border-top:2px solid ${escapeAttr(client.color||'#7A2B26')}; padding-top:3.5rem;">
        <div class="flex items-center justify-between mb-2 flex-wrap gap-3">
          <div>
            <h2 class="headline font-semibold" style="font-size:3.25rem; line-height:1.05;">${escapeHtml(client.name)}</h2>
            <p class="text-muted mt-3" style="font-size:1rem;">Rapport mensuel — ${monthLabel(report.month)} ${report.isExample?'<span class="badge badge-example">EXEMPLE</span>':''}</p>
          </div>
        </div>

        <div class="kpi-row mt-12 mb-2">
          <div class="kpi-item">
            <span class="eyebrow">Dépense totale</span>
            <p class="kpi-value">${fmtCur(totalSpend)}</p>
            ${deltaBadge(delta(totalSpend, prevTotalSpend))}
          </div>
          <div class="kpi-item">
            <span class="eyebrow">Leads totaux</span>
            <p class="kpi-value">${fmtInt(totalLeads)}</p>
            ${deltaBadge(delta(totalLeads, prevTotalLeads))}
          </div>
          <div class="kpi-item">
            <span class="eyebrow">CPL moyen</span>
            <p class="kpi-value">${fmtCur(blendedCpl)}</p>
            ${deltaBadge(delta(blendedCpl, dPrev ? safeDiv(prevTotalSpend, prevTotalLeads) : null))}
          </div>
          <div class="kpi-item">
            <span class="eyebrow">Conversions site</span>
            <p class="kpi-value">${fmtInt(d.website.conversions)}</p>
            ${deltaBadge(delta(d.website.conversions, dPrev ? dPrev.website.conversions : null))}
          </div>
        </div>

        <div class="report-section" style="margin-top:2.5rem;">
          ${platformTable("Meta Ads", d.meta, dPrev?dPrev.meta:null, [["spend","Dépense","cur"],["impressions","Impressions","int"],["clicks","Clics","int"],["leads","Leads","int"],["ctr","CTR","pct"],["cpc","CPC","cur"],["cpl","CPL","cur"]])}
        </div>
        <div class="report-section">
          ${platformTable("Google Ads", d.google, dPrev?dPrev.google:null, [["spend","Dépense","cur"],["impressions","Impressions","int"],["clicks","Clics","int"],["leads","Leads","int"],["ctr","CTR","pct"],["cpc","CPC","cur"],["cpl","CPL","cur"]])}
        </div>
        <div class="report-section">
          ${platformTable("Site web", d.website, dPrev?dPrev.website:null, [["sessions","Sessions","int"],["users","Utilisateurs","int"],["conversions","Conversions","int"],["convRate","Taux de conversion","pct"]])}
        </div>
        <div class="report-section">
          ${platformTable("Email", d.email, dPrev?dPrev.email:null, [["sent","Envoyés","int"],["openRate","Taux d'ouverture","pct"],["clickRate","Taux de clic","pct"]])}
        </div>
        ${d.custom.length ? `<div class="report-section">${customTable(d.custom, dPrev?dPrev.custom:null)}</div>` : ""}

        <div class="report-section">
          <div class="eyebrow mb-4">Visualisations</div>
          <div class="grid gap-8" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));">
            <div><p class="eyebrow mb-3">Répartition des dépenses</p><canvas id="chartSpend" height="200"></canvas></div>
            <div><p class="eyebrow mb-3">Leads &amp; conversions</p><canvas id="chartLeads" height="200"></canvas></div>
            <div><p class="eyebrow mb-3">Évolution du budget</p><canvas id="chartTrend" height="200"></canvas></div>
          </div>
        </div>
      </div>
    `;

    destroyCharts();
    const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() || '#8C8072';
    const rule = getComputedStyle(document.documentElement).getPropertyValue('--rule').trim() || '#D9CFBF';
    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#7A2B26';
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = rule;
    Chart.defaults.font.family = "'IBM Plex Mono', ui-monospace, monospace";
    Chart.defaults.font.size = 10;
    const legendLabelOpts = { color: muted, font:{ size:10, family:"'Inter', sans-serif", weight:'600' }, boxWidth:8, boxHeight:8, padding:14 };

    chartInstances.push(new Chart(document.getElementById('chartSpend'), {
      type: 'doughnut',
      data: {
        labels: ['META ADS','GOOGLE ADS'],
        datasets: [{ data: [d.meta.spend||0, d.google.spend||0], backgroundColor: [accentColor, rule], borderWidth:0 }]
      },
      options: { plugins:{legend:{position:'bottom', labels:legendLabelOpts}}, cutout:'72%' }
    }));

    chartInstances.push(new Chart(document.getElementById('chartLeads'), {
      type: 'bar',
      data: {
        labels: ['META ADS','GOOGLE ADS','SITE WEB'],
        datasets: [{ label:'Volume', data: [d.meta.leads||0, d.google.leads||0, d.website.conversions||0], backgroundColor: accentColor, borderRadius:0, maxBarThickness:40 }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:rule, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } } }
    }));

    const clientReports = data.reports.filter(r=>r.clientId===client.id).sort((a,b)=> a.month < b.month ? -1 : 1);
    chartInstances.push(new Chart(document.getElementById('chartTrend'), {
      type: 'line',
      data: {
        labels: clientReports.map(r=>monthLabel(r.month).toUpperCase()),
        datasets: [{
          label:'DÉPENSE TOTALE (€)',
          data: clientReports.map(r=>{ const cd = computeReport(r); return (cd.meta.spend||0)+(cd.google.spend||0); }),
          borderColor: accentColor, backgroundColor: accentColor+'14',
          fill:true, tension:.3, borderWidth:1.5, pointRadius: clientReports.map(r=> r.id===report.id ? 3.5 : 2), pointBackgroundColor: accentColor, pointBorderWidth:0
        }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, border:{display:false}, grid:{color:rule, lineWidth:.5} }, x:{ border:{display:false}, grid:{display:false} } } }
    }));
  }

  function rowMetric(label, type, curr, prevVal){
    const fmt = type==='cur' ? fmtCur : (type==='pct' ? fmtPct : (type==='dec' ? fmtDec : fmtInt));
    return `<tr>
      <td class="py-2.5 text-sm text-muted">${label}</td>
      <td class="py-2.5 text-sm font-mono text-right">${fmt(curr)}</td>
      <td class="py-2.5 text-right">${prevVal===undefined ? '' : deltaBadge(delta(curr, prevVal))}</td>
    </tr>`;
  }
  function platformTable(title, curr, prev, defs){
    return `
      <div class="eyebrow mb-4">${title}</div>
      <table>
        <thead><tr class="text-left">
          <th class="py-2 text-xs text-muted font-semibold" style="font-weight:600;">Indicateur</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">Valeur</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">vs mois précédent</th>
        </tr></thead>
        <tbody>
          ${defs.map(([key,label,type]) => rowMetric(label, type, curr[key], prev ? prev[key] : undefined)).join("")}
        </tbody>
      </table>`;
  }
  function customTable(curr, prev){
    return `
      <div class="eyebrow mb-4">Métriques personnalisées</div>
      <table>
        <thead><tr class="text-left">
          <th class="py-2 text-xs text-muted font-semibold">Indicateur</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">Valeur</th>
          <th class="py-2 text-xs text-muted font-semibold text-right">vs mois précédent</th>
        </tr></thead>
        <tbody>
          ${curr.map(c => {
            const prevItem = prev ? prev.find(p=>p.label===c.label) : null;
            return rowMetric(escapeHtml(c.label), 'dec', c.value, prevItem ? prevItem.value : undefined);
          }).join("")}
        </tbody>
      </table>`;
  }

  /* ---------- CSV export ---------- */
  function exportCsv(reportId){
    const report = data.reports.find(r=>r.id===reportId);
    const client = data.clients.find(c=>c.id===report.clientId);
    const d = computeReport(report);
    const rows = [["Section","Indicateur","Valeur"]];
    rows.push(["Client","Nom",client.name]);
    rows.push(["Rapport","Mois",monthLabel(report.month)]);
    const push = (section, label, val) => rows.push([section,label, val===null||val===undefined||isNaN(val) ? "" : val]);

    push("Meta Ads","Dépense (€)", d.meta.spend); push("Meta Ads","Impressions", d.meta.impressions);
    push("Meta Ads","Clics", d.meta.clicks); push("Meta Ads","Leads", d.meta.leads);
    push("Meta Ads","CTR (%)", d.meta.ctr); push("Meta Ads","CPC (€)", d.meta.cpc); push("Meta Ads","CPL (€)", d.meta.cpl);

    push("Google Ads","Dépense (€)", d.google.spend); push("Google Ads","Impressions", d.google.impressions);
    push("Google Ads","Clics", d.google.clicks); push("Google Ads","Leads", d.google.leads);
    push("Google Ads","CTR (%)", d.google.ctr); push("Google Ads","CPC (€)", d.google.cpc); push("Google Ads","CPL (€)", d.google.cpl);

    push("Site web","Sessions", d.website.sessions); push("Site web","Utilisateurs", d.website.users);
    push("Site web","Conversions", d.website.conversions); push("Site web","Taux de conversion (%)", d.website.convRate);

    push("Email","Envoyés", d.email.sent); push("Email","Taux d'ouverture (%)", d.email.openRate); push("Email","Taux de clic (%)", d.email.clickRate);

    d.custom.forEach(c => push("Personnalisé", c.label, c.value));

    const csv = rows.map(row => row.map(cell => {
      const s = String(cell===null||cell===undefined?"":cell);
      return /[",;\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    }).join(";")).join("\r\n");

    const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `rapport_${client.name.replace(/[^a-z0-9]+/gi,'_')}_${report.month}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- Event delegation ---------- */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if(action === "select-client"){ state = {clientId:id, reportId:null, mode:"reports"}; render(); }
    else if(action === "new-client"){ state.mode = "new-client"; render(); }
    else if(action === "edit-client"){ state.mode = "edit-client"; render(); }
    else if(action === "load-example"){ loadExample(); }
    else if(action === "clear-example"){ removeExampleData(); }
    else if(action === "go-dashboard"){ state = {clientId:null, reportId:null, mode:"welcome"}; render(); }
    else if(action === "go-settings"){ state.mode = "settings"; render(); }
    else if(action === "new-report"){ state.reportId = null; state.mode = "form"; render(); }
    else if(action === "open-report"){ state.reportId = id; state.mode = "preview"; render(); }
    else if(action === "edit-report"){ state.reportId = id; state.mode = "form"; render(); }
    else if(action === "delete-report"){
      if(confirm("Supprimer ce rapport ?")){
        data.reports = data.reports.filter(r=>r.id!==id);
        saveData();
        render();
      }
    }
    else if(action === "back-to-reports"){ state.mode = "reports"; state.reportId = null; render(); }
    else if(action === "export-csv"){ exportCsv(id); }
  });

  /* ---------- Init ---------- */
  render();

  // offer example removal via console-accessible hook if example exists and user wants to clear it
  window.__rapport_removeExample = removeExampleData;
})();
</script>
</body>
